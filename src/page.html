<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="match" content="">   <!-- the match id when the page comes from / (index.js); empty at /m/<id> -->
<title>Rob's Game</title>
<!-- fonts served from this Worker (public/fonts, copied from tap-game: latin only, from npm's @fontsource; SIL Open Font License) -->
<link rel="preload" href="/fonts/cinzel-latin-600-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/fonts/eb-garamond-latin-500-normal.woff2" as="font" type="font/woff2" crossorigin>
<style>
  @font-face { font-family: Cinzel; font-weight: 600; font-display: swap; src: url(/fonts/cinzel-latin-600-normal.woff2) format("woff2"); }
  @font-face { font-family: Cinzel; font-weight: 800; font-display: swap; src: url(/fonts/cinzel-latin-800-normal.woff2) format("woff2"); }
  @font-face { font-family: "EB Garamond"; font-weight: 500; font-display: swap; src: url(/fonts/eb-garamond-latin-500-normal.woff2) format("woff2"); }
  @font-face { font-family: "EB Garamond"; font-weight: 700; font-display: swap; src: url(/fonts/eb-garamond-latin-700-normal.woff2) format("woff2"); }
  @font-face { font-family: "EB Garamond"; font-weight: 500; font-style: italic; font-display: swap; src: url(/fonts/eb-garamond-latin-500-italic.woff2) format("woff2"); }
  /* UN/TAP's "Grimoire Pastel" cards (tap-game src/page.html), with Rob's Game's text and no power/toughness box (kura, Nov 4) */
  :root {
    --bg: #1d2742; --panel: #f7fbff; --line: #b9d0ea; --frame: #8fb6de; --cream: #fffaf2;
    --ink: #3a4a6b; --mute: #5a6a8a; --pink: #e98ab3; --blue: #6d8fd0;
    --title: Cinzel, Georgia, serif; --body: "EB Garamond", Georgia, serif;
    /* five across: 78px = the page's 16px sides, the panel's 10px padding and 1px border each side, and four 6px gaps (was 72: 6px too
       wide on a phone, so the hand scrolled sideways) */
    --w: min(112px, calc((100vw - 78px) / 5)); --u: calc(var(--w) / 108); --h: 134; --ph: 76;   /* --ph: the places' and small cards' height per 108 of width (66 on a phone, below). --h: 16 shorter than 150: the name bar's 12 and its 4 gap (kura, Nov 5: "make the cards shorter") */
    --sw: min(100px, calc((100vw - 72px) / 6));   /* small cards (fields, the stack, a Wiretap's look): name, picture and card name only */
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; color: var(--ink); height: 100%; overflow: hidden; }   /* one screen: fit(), below */
  html { background: var(--bg); }
  body { font: 15px/1.35 var(--body); }
  /* the space behind everything (kura, Nov 4: the same space picture as UN/TAP), on its own fixed layer because iPhones ignore
     background-attachment: fixed; the midnight blue shows until it loads */
  body::before { content: ""; position: fixed; inset: 0; z-index: -1; background: var(--bg) url(/space.jpg) center / cover; }
  #game { max-width: 640px; margin: 0 auto; padding: 12px 16px; display: flex; flex-direction: column; gap: 8px; user-select: none; -webkit-user-select: none; transform-origin: top center; }
  h1 { font: 800 22px/1 var(--title); letter-spacing: 2px; color: var(--frame);   /* blue (kura, Nov 5; was pink) */
       margin: 0; display: flex; justify-content: space-between; align-items: baseline; }
  h1 a { font: 600 12px/1 var(--title); letter-spacing: 1.5px; color: var(--blue); text-decoration: none; }
  .side { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; display: flex; flex-direction: column; gap: 6px; }
  .stat { font: 600 12px/1 var(--title); letter-spacing: 1.5px; text-transform: uppercase; color: var(--blue); display: flex; gap: 12px; flex-wrap: wrap; }
  .stat b { color: var(--ink); }
  /* the opponent's line (kura, Nov 5: "rename THE WEBMASTER to "STUDENT ATHLETE #832"" and put it "left-justified, underneath the
     opponents deck cards, on the same line as "Deck 25""): under its three places at the left, where the deck's label was */
  .zone { position: relative; }
  .zone .stat { position: absolute; left: 0; top: calc(var(--sw) * var(--ph) / 108 + 5px); white-space: nowrap; }
  .row { display: flex; gap: 6px; flex-wrap: wrap; min-height: calc(var(--sw) * var(--ph) / 108); align-items: center; }
  /* your hand stays one row: it scrolls sideways when it's wider than the screen */
  /* the stack: the cards being cast, full size, in the middle of the screen */
  #stack { justify-content: center; align-items: flex-end; flex-wrap: nowrap; }
  /* every panel keeps one height whatever is in it, so nothing on the screen moves up or down (kura, Nov 4) */
  #stack { height: calc(var(--stack-w) * var(--h) / 108 + 12px); }   /* not clipped, so a card flying in shows all the way (kura, Nov 4) */
  /* a row of piles and Broadcasts: a small card and its label (kura, Nov 4: no empty space under the piles) */
  .zone { height: calc(var(--sw) * var(--ph) / 108 + 20px); }
  /* wider than a phone, each row of piles and Broadcasts has 5 things (3 places, deck, graveyard), so they line up in your hand's
     5 columns, as wide as its cards (kura, Nov 4: "spread out evenly across and match the cards below them") */
  @media (min-width: 501px) {
    .side .zone { --sw: var(--w); display: grid; grid-template-columns: repeat(5, var(--w)); gap: 6px; align-items: start; }
    .zone .row, .zone .piles { display: contents; }
    .side:not(.them) .zone { height: calc(var(--sw) * var(--ph) / 108 + 4px); }   /* no labels under your piles: just the deck's 4px stack */
  }
  .zone .row { flex-wrap: nowrap; overflow: hidden; }
  #hand { height: calc(var(--h) * var(--u) + 4px); }
  /* the shared footer (dungeon-items footer.js), drawn into #ddfoot under the screen, a little in from the right (as in tap-game);
     3px under the last panel (kura, Nov 5: "move up towards the frame a bit more, still outside but closer"; it was 9px: the 8px gap + 1px) */
  .ddfoot { margin: -5px 0 0 !important; padding: 0 12px !important; }
  #hand { flex-wrap: nowrap; overflow-x: auto; min-height: calc(var(--h) * var(--u)); padding-top: 2px; }
  .row:empty::after { content: attr(data-empty); font-style: italic; color: var(--mute); }
  #hand:not(:has(.card))::before { content: attr(data-empty); font-style: italic; color: var(--mute); }   /* your hand always holds the phone deck, so it is never :empty */
  .mid { background: #f0f6ff; border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; display: flex; flex-direction: column; gap: 6px; }
  /* your buttons: the upper right of your panel (kura, Nov 4) */
  /* your button (pass turn, resolve, don't pay) is a bar of its own above your panel, like UN/TAP's (kura, Nov 4: "the pass turn line be
     it's own panel like in un/tap"; tap-game's button.act); the bar keeps its height when there's no button, so nothing moves */
  .bar { display: flex; gap: 8px; height: 50px; flex: none; }
  .bar button { flex: 1; height: 50px; border-radius: 6px; border: 2px solid #fff; cursor: pointer; color: #3a2a4a; background: #b3cdf7;
                font: 800 17px/1 var(--title); letter-spacing: 3px; text-transform: uppercase; }
  /* blue whenever you can press it, grey when it only says what's happening (kura, Nov 5: "always be colored blue, except when its the
     inactive grey"; was pink, with a blue Resolve) */
  .bar button:disabled { cursor: default; background: #d3d9e3; color: #5f6b80; }
  .bar button:focus-visible, .card:focus-visible { outline: 2px solid var(--pink); outline-offset: 2px; }
  /* an error (a refused move, a dropped connection) shows over the log's last line until your next move; it takes no room of its own
     (kura, Nov 5: "save a little room underneath the main card ... it looks like there's maybe an empty row there"; it kept 1.2em) */
  #err { color: #d4558c; font-size: 13px; position: absolute; left: 10px; right: 40px; bottom: 8px; z-index: 2; background: #f0f6ff; }
  #err:empty { display: none; }
  /* "Turn 4, Move 2" in the upper left of the middle panel (kura, Nov 5): the turn counts each player's turn; the move counts the cards
     played this turn by either side, counters and a discard-to-draw included, from 0 */
  .mid { position: relative; }
  #turnno { position: absolute; left: 10px; top: 8px; font: 600 11px/1 var(--title); letter-spacing: 1px; color: var(--blue); pointer-events: none; }
  /* how to play again, any time: a small "?" at the bottom right of the middle panel, in the how-to box's light blue; resting the mouse on it
     shows the opening's how-to box over the panel, and a tap (a phone) shows or hides it (kura, Nov 5) */
  #help { position: absolute; right: 10px; bottom: 8px; width: 22px; height: 22px; padding: 0; border: 1px solid var(--frame); border-radius: 6px;
          background: #f0f6ff; color: var(--blue); font: 600 13px/1 var(--title); cursor: pointer; z-index: 7; }   /* above the how-to it opens, so a click closes it */
  #log { padding-right: 30px; }   /* the log's lines stop short of the "?" */
  #helpbox { position: absolute; inset: 0; z-index: 6; display: flex; align-items: center; justify-content: center; padding: 10px 10px 50px;
             background: #f0f6ff; border-radius: 10px; pointer-events: none; }
  #helpbox[hidden] { display: none; }
  /* the opening's how-to box, centred on the whole panel exactly where the "?" shows it, with nothing hidden under it (kura, Nov 5: "move
     the intro screen/left box down to match") */
  #intro { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; padding: 10px 10px 50px; pointer-events: none; }
  #intro[hidden] { display: none; }
  /* both boxes sit 20px above the panel's middle: 40px more room below them than above (kura, Nov 5: "move the box up just a bit on all screens") */
  /* the log: a strip across the bottom of the middle panel, under the stack, so its lines are long and mostly one line each (kura,
     Nov 5: "a little bigger font size, and have a longer row that sits closer to the bottom of the panel ... less double lines"; it was
     a narrow column left of the stack, in 9px); 3 lines high, each older line fainter */
  #log { height: calc(3 * 1.3em); white-space: pre-wrap; font: italic 500 15px/1.3 var(--body); overflow: hidden; color: var(--ink); display: flex; }
  /* a C:\> on each row of the box, always there and still, like tap-game: only the lines beside them slide and fade (kura, Nov 5: "can the
     C:\> always be persistent like in tap-game"; each line had its own, which slid and faded with it). The rows are 1.3em apart with no gap,
     so a wrapped line's second row has its prompt too. The box is exactly its rows tall, so no sliver of the line above shows (kura, Nov 5:
     "you can see a little bit of the bottom of the line above"; it kept the 6px the old 3px gaps used). */
  #logPrompts, #logLines { display: flex; flex-direction: column; justify-content: flex-end; overflow: hidden; }
  #logPrompts { flex: none; white-space: pre; }
  #logPrompts div:last-child { font-weight: 700; }
  #logLines { flex: 1; min-width: 0;
              -webkit-mask-image: linear-gradient(to bottom, rgba(0,0,0,.25), #000 34%); mask-image: linear-gradient(to bottom, rgba(0,0,0,.25), #000 34%); }
  /* the text fades towards the top: 25% at the box's top edge, whole by the end of its top line (kura, Nov 5; was each older line fainter) */
  /* no box of its own, and newest at the bottom: a new line slides the lines up (kura, Nov 5: "take the panel background away" and
     "newest messages appear on the bottom ... one line at a time scrolling up") */
  /* its last line says what to do now (kura, Nov 4: it was a line of its own above the stack) */
  #log .now { font-weight: 700; }
  #log .now.win { color: #2f9e6b; } #log .now.lose { color: #d4558c; }
  /* the card: blue frame, cream inside (tap-game's .gc) */
  .card { position: relative; width: var(--w); height: calc(var(--h) * var(--u)); border: 0; padding: 0; background: none; border-radius: calc(7 * var(--u)); text-align: left; color: var(--ink); flex: none; }
  .card.small { --w: var(--sw); --u: calc(var(--w) / 108); height: calc(var(--ph) * var(--u)); }
  .card.can { cursor: pointer; }   /* no glow (kura, Nov 4: "no glow please"); the cards you can't play are dimmed */
  .card.dim { opacity: .55; }
  .card.gap { visibility: hidden; }
  #hand .handdeck { display: none; }   /* your deck in the hand's last place: phones only (below) */
  /* on a phone your deck stays in the 6th place however few cards you hold: empty places fill the hand up to 5 before it (kura, Nov 5:
     "sometimes my deck card moves to the left side of the row") */
  #hand .handpad { display: none; }
  /* a deck's count on its back, big and white, with no label under it, on every screen and for both decks (kura, Nov 5: "the deck card
     #'s on top of the deck, in big white numbers ... with no "deck #" below"; it was phones only, the Webmaster's deck) */
  .pile .back { display: flex; align-items: center; justify-content: center; }
  .back .deckn { display: block; font: 800 calc(var(--sw) * 22 / 108)/1 var(--title); color: #fff; text-shadow: 0 1px 3px rgba(0,0,0,.6); }
  .pile:first-child > span { display: none; }
  /* the graveyard's count on its card, with a gravestone, instead of the "graveyard" label, on every screen (kura, Nov 5; phones only at first): white on a small black box in
     the middle, with the card showing around it (kura, Nov 5: "no glow ... a black background for just the emoji and the number") */
  .pile:has(.gravn) > span { display: none; }
  .pile .gravn { display: block; position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); pointer-events: none; white-space: nowrap;
                 font: 800 calc(var(--sw) * 20 / 108)/1 var(--title); color: #fff; background: #000; border-radius: 3px;
                 padding: calc(var(--sw) * 3 / 108) calc(var(--sw) * 6 / 108); }   /* sized with the card again (kura, Nov 5: "bigger again like it was before"; 10px for a moment) */
  /* on your turn your graveyard's box says DISCARD: off (grey on black) until tapped, then pink like its outline (kura, Nov 5: "the
     button is turned off ... click it to turn on, DISCARD maybe lights up pink like the border"); smaller, so the word fits the card */
  .pile.tapme .gravn { font-size: calc(var(--sw) * 13 / 108); letter-spacing: 1px; color: #9aa3b8; }
  .pile.tapme.on .gravn { background: var(--pink); color: #fff; }
  /* a card face down: the card-back stripes over it (a Wiretap's cards going back on a deck, and the dummy's look at yours) */
  .card.down { background: repeating-linear-gradient(45deg, var(--frame) 0 6px, color-mix(in srgb, var(--frame) 85%, #000) 6px 12px); }
  .card.down .gc { visibility: hidden; }
  /* the stack's cards stay in the middle, and a Wiretap's look cards come in to their right, sized to fit there (kura, Nov 4: "can the
     main card stay where it is and the buttons come in to the right of it"); 24px: a 6px gap before them and between them */
  /* the card being played is big (kura, Nov 4: "a lot bigger, not smaller"): --stack-w, about 1.45 times a hand card on a wide screen,
     as wide as a hand card on a phone */
  #stack { container-type: inline-size; }
  /* how to play (before the first move, and from the "?"): all light blue, in a thin frame (kura, Nov 5) */
  #helpbox > .howto, #intro > .howto { align-self: center; max-width: 520px; border: 1px solid var(--frame); border-radius: 8px; padding: 10px 14px; color: var(--blue);
                    font: 500 18px/1.35 var(--body); display: flex; flex-direction: column; gap: 4px; }   /* bigger (kura, Nov 5: was 15px, title 14px) */
  #helpbox > .howto div:first-child, #intro > .howto div:first-child { font: 600 17px/1.3 var(--title); letter-spacing: 1px; }
  .howto ul { margin: 0; padding-left: 1.1em; display: flex; flex-direction: column; gap: 4px; }
  .mid { --stack-w: calc(var(--w) * 1.45 + 17px); }   /* + the room the "you" label took (kura, Nov 4: "bigger") */
  #stack .mid-stack .card { --w: var(--stack-w); --u: calc(var(--w) / 108); }
  #stack > .mid-stack { flex: none; display: flex; align-items: flex-end; }
  #stack > .stack-side { flex: 1 1 0; min-width: 0; align-self: stretch; display: flex; gap: 6px; align-items: center; }
  /* a Wiretap's look cards: stacked down the right side (kura, Nov 4: "3 buttons stacked vertically on the right"), as big as fit the
     row's height (3 small cards and two 6px gaps in the stack's height less 12px) and the right side's width */
  #stack > .stack-side.right { padding-left: 6px; flex-direction: column; justify-content: center; align-items: flex-start; }
  #stack .stack-side .look { --sw: min(calc(50cqw - var(--stack-w) / 2 - 12px), calc((var(--stack-w) * var(--h) / 108) * 108 / 228)); }
  /* a graveyard card: grey, and its picture is a still frame (kura, Nov 4) */
  .card.gone > .gc { filter: grayscale(1); opacity: .75; }   /* the face only, so a tappable graveyard's outline stays pink (kura, Nov 5) */
  .gc-art canvas { width: calc(88 * var(--u)); height: calc(31 * var(--u)); image-rendering: pixelated; }
  /* the Webmaster's: its cards, card backs and panel are a darker blue, so you can tell whose card is whose on the stack (kura, Nov 5; lavender
     before, but red-green colour blindness sees lavender and this blue as nearly the same; then mint, which "pops too much", then peach); its
     labels darker still. Darker and lighter blue stay apart for colour blindness too: it keeps lightness */
  .theirs, .them { --frame: #5679b6; }   /* a little lighter than #4a6fae (kura, Nov 5) */
  .them { --blue: #34548c; }
  /* its card backs are checks instead of your stripes (kura, Nov 5: picked "A checks" of four patterns): its deck, its face-down cards and
     its big card's back; the squares are the stripes' two shades */
  .them .back, .card.down.theirs, .zoom.theirs .zback { background: repeating-conic-gradient(var(--frame) 0 25%, color-mix(in srgb, var(--frame) 85%, #000) 0 50%) 0 0 / 10px 10px; }
  .gc { width: 100%; height: 100%; background: var(--frame); border-radius: calc(7 * var(--u)); padding: calc(5 * var(--u)); display: flex; flex-direction: column; }
  .gc-in { flex: 1; background: var(--cream); border-radius: calc(3 * var(--u)); padding: calc(4 * var(--u)); display: flex; flex-direction: column; gap: calc(4 * var(--u)); border: 1px solid var(--line); min-height: 0; }
  .gc-name { font: 600 calc(7.6 * var(--u))/1 var(--title); background: #ffe1ee; border: 1px solid #f0b8d0; border-radius: 2px; padding: 0 calc(4 * var(--u));
             height: calc(12 * var(--u)); display: flex; align-items: center; white-space: nowrap; overflow: hidden; }
  /* no name bar on the cards, only on the big card (kura, Nov 5: "remove the pink header from the cards ... remove the whole bar") */
  .card .gc-name { display: none; }
  .gc-art { height: calc(31 * var(--u)); display: flex; align-items: center; justify-content: center; }
  .gc-art img { width: calc(88 * var(--u)); height: calc(31 * var(--u)); image-rendering: pixelated; }
  .gc-type { font: 500 calc(11 * var(--u))/1 var(--body); background: #e2f0ff; border: 1px solid var(--line); border-radius: 2px; padding: 0 calc(4 * var(--u));
             height: calc(15.2 * var(--u)); display: flex; align-items: center; white-space: nowrap; overflow: hidden; }
  /* as big as fits (kura, Nov 5: "Instant and Sorcery font much bigger ... as big as possible"; was 6.4 in a 15 bar), then down to 12 and
     11 (kura, Nov 5); 14 cut Wiretap's text */
  /* a GPU (a game point; the Broadcast before v0.69): its type line is inverted (kura, Nov 4) */
  .broadcast .gc-type { background: var(--ink); color: #e2f0ff; border-color: var(--ink); }
  .gc-txt { flex: 1; min-height: 0; overflow: hidden; background: #fffdf8; border: 1px solid var(--line); border-radius: 2px; padding: calc(4 * var(--u));
            font: 500 calc(11 * var(--u))/1.12 var(--body); display: flex; flex-direction: column; gap: calc(2 * var(--u)); }
  .gc-txt b { font-weight: 700; }
  .rule { margin-block: calc(1.5 * var(--u)) calc(.75 * var(--u)); width: 60%; height: 1px; background: #d9c9a8; align-self: center; flex: none; }
  .flav { font: italic 500 calc(5.8 * var(--u))/1.1 var(--body); color: var(--mute); }
  /* like UN/TAP: no flavour line (or the line above it) on the cards, so the card text is bigger; with each card's short line it is 11, the
     biggest that fits all eight (kura, Nov 5; 12 cut Remand off); the big card shows the flavour and the full text, at the old 7.5 (kura, Nov 5: "like UN/TAP where we took the flavor text off and made the card text bigger") */
  .rule, .flav { display: none; }
  .zoom .rule, .zoom .flav { display: block; }
  .zoom .gc-txt { font-size: calc(7.5 * var(--u)); }
  /* small cards (fields, the stack, the dummy's looks) show only the name, picture and card name */
  .card.small .gc-txt { display: none; }
  /* small cards (fields, graveyards, the stack's look) use their frame better: a thinner frame and inside, the picture as wide as fits,
     picture and name bar in the middle, and a bigger name (kura, Nov 5: "played button text bigger ... using the frame space better";
     was a 5 frame, 4 inside, the picture at the top and the name at 8) */
  .card.small .gc { padding: calc(3 * var(--u)); }
  .card.small .gc-in { padding: calc(3 * var(--u)); justify-content: center; }
  .card.small .gc-art { height: auto; }
  .card.small .gc-art img, .card.small .gc-art canvas { width: 100%; height: auto; aspect-ratio: 88 / 31; }
  .card.small .gc-type { font-size: calc(12 * var(--u)); }
  /* a GPU's big card: "Enchantment — Blackwell", smaller so the longest ("Ada Lovelace") fits, and its full text a little smaller so
     the flavour line fits under it (kura, Nov 5); other cards' big cards keep their sizes */
  .zoom .gc-type.sub { font-size: calc(7 * var(--u)); }
  .zoom .gc-type.sub.long { font-size: calc(6.5 * var(--u)); }
  .zoom.broadcast .gc-txt { font-size: calc(6.8 * var(--u)); }
  /* a resolved GPU's green dot, after "GPU · ONLINE" on its bar (kura, Nov 5) */
  .card.small .gc-type.on { font-size: calc(11 * var(--u)); }   /* a little smaller than other small bars, so the dot fits */
  .gc-type .online { width: .5em; height: .5em; border-radius: 50%; background: #4ade80; margin-left: .35em; flex: none; }
  /* the piles: a deck face down (tap-game's card-back stripes, thicker the more cards are left) and a graveyard's top card face up */
  .zone { display: flex; gap: 10px; align-items: flex-start; }
  .zone .row { flex: 1; min-width: 0; }
  .piles { display: flex; gap: 8px; flex: none; }
  .pile { display: flex; flex-direction: column; align-items: center; gap: 7px; font: 600 10px/1 var(--title); letter-spacing: 1px; text-transform: uppercase; color: var(--blue); }
  .pile b { color: var(--ink); }
  .pile.tapme { cursor: pointer; }
  /* your graveyard: a grey dotted outline all the time, solid pink while you pick a card to discard (kura, Nov 5) */
  /* your graveyard's outline is drawn on its place, not on its top card, so it stays put all the time, even while a card flies in
     (kura, Nov 5: "can we have the graveyard outline there persistent all the time"; it used to fly in on the new card) */
  .pile { position: relative; }
  #mPiles .pile:last-child::before { content: ""; position: absolute; top: 0; left: 50%; transform: translateX(-50%); pointer-events: none;
    width: var(--sw); height: calc(var(--sw) * var(--ph) / 108); border-radius: calc(7 * var(--sw) / 108); outline: 2px dotted #9aa3b8; outline-offset: -2px; }
  /* the outline just inside the place, like the GPU places' dotted borders, so the five are evenly spaced (kura, Nov 5: "space all 5
     out evenly across the width and make it look nice and work with the dotted line"; it was 2px outside) */
  #mPiles .pile:last-child > .slot { border-color: transparent; }   /* the outline is its border: no dashed line under it */
  #mPiles .pile.tapme.on:last-child::before { outline: 2px solid var(--pink); }
  .pile.tapme.on span { color: var(--pink); }
  .back { width: var(--sw); height: calc(var(--sw) * var(--ph) / 108); border-radius: calc(7 * var(--sw) / 108); flex: none;
          background: repeating-linear-gradient(45deg, var(--frame) 0 6px, color-mix(in srgb, var(--frame) 85%, #000) 6px 12px); }
  .slot.spot { border-style: dotted; }   /* a Broadcast's empty place: dotted (kura, Nov 4) */
  /* ... with a crossed-out signal and "Broadcast: OFF" in it (kura, Nov 4: "some sort of no signal sign"); sized to the place, small (kura, Nov 4: "can the text be smaller"), 6px at least */
  .slot.spot { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: calc(var(--sw) * .04); color: #9aa3b8;
               font: 600 max(6px, calc(var(--sw) * .075))/1.15 var(--title); letter-spacing: .5px; text-transform: uppercase; text-align: center; }
  .slot.spot svg { width: calc(var(--sw) * .28); height: calc(var(--sw) * .28); }
  .slot { width: var(--sw); height: calc(var(--sw) * var(--ph) / 108); border-radius: calc(7 * var(--sw) / 108); border: 1.5px dashed var(--line); flex: none; }
  /* the stack, like Magic's: each card cast in answer sits on top of the one before, overlapping it and a little higher (kura, Nov 4) */
  #stack .mid-stack .card + .card { margin-left: calc(-0.55 * var(--stack-w)); }
  /* a card arriving: yours slides up from your hand, the dummy's down from its side; a Broadcast that lands pops in */
  /* on a phone your hand is two rows, 3 and then 2, so each card is about 1.7 times as wide (kura, Nov 4: "make the cards bigger on mobile",
     using the empty height); 66px = the page's 16px sides, the panel's 10px padding and 1px border each side, and two 6px gaps */
  /* on a phone the panels sit 5px in from the screen's edges with 8px inside them (kura, Nov 5: "decrease to like 5px on each side";
     was 14px); 52px = two 5px gaps, the panel's 1px border and 8px padding each side, and four 6px gaps between cards */
  @media (max-width: 500px) {
    :root { --w: calc((100vw - 52px) / 5); --sw: calc((100vw - 46px) / 6); }
    #game { padding: 8px 0; }
    .side, .mid, .bar { margin: 0 5px; }
    .side, .mid { padding-left: 8px; padding-right: 8px; }   /* room for a tappable graveyard's dashed outline (kura, Nov 5: "a little more padding"; was 4px) */
    #helpbox > .howto, #intro > .howto { font-size: 16px; padding: 8px 12px; } #helpbox > .howto div:first-child, #intro > .howto div:first-child { font-size: 15px; }   /* smaller on a phone (kura, Nov 5; 16 and 15 since "bigger", were 13 and 12) */
    #log { font-size: 14px; }   /* a phone: a little smaller, so most lines still fit on one (kura, Nov 5: bigger; was 12) */
    h1 { margin: 0 5px; }
    /* 40px: two 5px gaps, the panel's 1px border and 8px padding each side, and two 6px gaps between cards */
    /* the page shorter on a phone, so fit() shrinks it less and it fills more of the width (kura, Nov 5: "yes" to the first four, "but can we
       keep the main area card as big as possible, using some of the space above it", "button ... a bit fatter", "the "temps unstable" and
       graveyard row a little thinner", "remove some of the space below STUDENT ATHLETE line"): */
    .side:not(.them) { --ph: 66; }   /* your panel's places and small cards a little shorter (76 elsewhere; kura: "only shorter in the player's panel") */
    #game { gap: 6px; }   /* 6px between the big parts (8 elsewhere) */
    .bar, .bar button { height: 44px; }   /* the button (50 elsewhere) */
    .bar button { white-space: nowrap; font-size: 16px; letter-spacing: 2px; }   /* "Student Athlete's answering" on one line (17px, 3px elsewhere) */
    #log { height: calc(2 * 1.3em); }   /* 2 lines (3 elsewhere) */
    .side.them { padding-bottom: 4px; }   /* less under the opponent's line (8 elsewhere) */
    /* the card being played takes the 12px kept above it for flying cards (the row stays as tall): 12 * 108 / 134 wider */
    .mid { --stack-w: calc((100vw - 40px) / 3 + 17px + 9.7px); }
    #stack { height: calc(var(--stack-w) * var(--h) / 108); }
    #hand { --w: calc((100vw - 40px) / 3); --u: calc(var(--w) / 108); flex-wrap: wrap; height: auto; overflow: visible; }
    /* each side's row fills the panel (kura, Nov 5: "make the broadcast off squares fit the size of the panel"); its height follows them */
    .zone { height: auto; }
    #tField, #mField { min-height: 0; align-items: flex-start; }
    /* with no labels under the piles, the deck and graveyard are the Broadcast places' size, and every place in the row is one size
       (kura, Nov 5: "make the cards match the other broadcast off squares"): 5 in the Webmaster's row (3 places, deck, graveyard), 4 in
       yours (your deck is in your hand); 6px between them */
    .side .zone { container-type: inline-size; gap: 6px; --sw: calc((100cqw - 18px) / 4); }
    .side.them .zone { --sw: calc((100cqw - 24px) / 5); }
    .piles { gap: 6px; }
    /* your deck moves from the piles into the hand's last place, face down at card size (kura, Nov 4: "last space can be the player's
       deck, face down cards") */
    #mPiles .pile:first-child { display: none; }
    /* its count in the middle of the card back, no label under it (kura, Nov 4: "just put a 20 in the middle of the back of the card") */
    #hand .handpad { display: block; }
    .side.them .zone { flex-wrap: wrap; }   /* a phone's places fill the row: the opponent's line goes on a line of its own under them */
    .zone .stat { position: static; flex: 0 0 100%; }
    #hand .handdeck { display: flex; align-items: center; justify-content: center; width: var(--w); height: calc(var(--h) * var(--u)); border-radius: calc(7 * var(--u));
                      font: 800 calc(22 * var(--u))/1 var(--title); color: #fff; text-shadow: 0 1px 3px rgba(0,0,0,.6); }
  }
  /* the big card, copied from UN/TAP (tap-game src/page.html, kura, Nov 4: "copy the big card hover thing from un/tap exactly"): hold a
     card (hover with a mouse) to see it whole; --u is set again here so the whole card scales */
  .zoom { position: fixed; inset: 0; z-index: 20; display: flex; align-items: center; justify-content: center; background: rgba(20, 26, 48, .45); pointer-events: none; }
  .zoom .zbox { --w: min(78vw, 300px); --u: calc(var(--w) / 108); --h: 150;   /* the big card keeps its name bar, so its height */
                 width: var(--w); height: calc(var(--h) * var(--u)); position: relative; filter: drop-shadow(0 8px 24px rgba(0,0,0,.45)); perspective: calc(600 * var(--u)); }
  /* it turns with your finger or mouse, and past a quarter turn shows its back (UN/TAP's: 88x31 club's face-down stripes in the frame blue) */
  .zflip { position: absolute; inset: 0; transform-style: preserve-3d; }
  /* a finger sliding sideways on a card turns the big card, so the browser mustn't take the slide as a pan (that would cancel the hold) */
  .card { touch-action: pinch-zoom; }
  .zflip > .gc, .zflip > .zback { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; }
  /* thickness: the front sits --zd/2 in front, the back --zd/2 behind, and ZEDGE layers of a darker frame blue fill the gap */
  .zflip { --zd: calc(1 * var(--u)); }
  .zflip > .gc { transform: translateZ(calc(var(--zd) / 2)); }
  .zedge { position: absolute; inset: 0; border-radius: calc(7 * var(--u)); background: color-mix(in srgb, var(--frame) 75%, #000);
           transform: translateZ(calc((var(--k) - .5) * var(--zd))); }
  .zback { transform: rotateY(180deg) translateZ(calc(var(--zd) / 2)); border-radius: calc(7 * var(--u)); background: repeating-linear-gradient(45deg, var(--frame) 0 8px, color-mix(in srgb, var(--frame) 85%, #000) 8px 16px); }
  /* a GPU in 3D on its big card (GPU_3D, below): one art pixel is one --u; each face is a pixel texture */
  .gpu3d { position: absolute; left: 0; top: 0; width: calc(88 * var(--u)); height: calc(31 * var(--u)); transform-style: preserve-3d; pointer-events: none; }
  .gpu3d .f { position: absolute; left: 0; top: 0; transform-origin: 0 0; image-rendering: pixelated; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
<div id="game">
  <h1>ROB'S GAME <a href="/">new match</a></h1>
  <div class="side them">
    <div class="zone"><div class="row" id="tField"></div><div class="piles" id="tPiles"></div>
      <div class="stat">Student Athlete #832 <span>hand <b id="tHand" data-count="t-hand">0</b></span></div></div>
  </div>
  <div class="mid">
    <div id="turnno"></div>
    <div class="row" id="stack" data-empty=""></div>
    <div id="err"></div>
    <div id="log"><div id="logPrompts"><div>C:\&gt; </div><div>C:\&gt; </div><div>C:\&gt; </div></div><div id="logLines"></div></div>
    <button id="help" type="button" aria-label="How to play">?</button>
    <div id="intro" hidden></div>
    <div id="helpbox" hidden></div>
  </div>
  <div class="bar" id="acts"></div>
  <div class="side">
    <div class="zone"><div class="piles" id="mPiles"></div><div class="row" id="mField"></div></div>
    <div class="row" id="hand" data-empty="No cards in hand."></div>
  </div>
  <div id="ddfoot"></div>
</div>
<script defer src="https://dungeon-items.ddddungeon.workers.dev/footer.js" data-version="v1.00" data-copy="no"></script>
<script>
  // name, type, the card's short line, and the full text for the big card (kura, Nov 5: "simple one-line explanations, and then the
  // expanded one on the zooms"); the full text is the same as rules.js CARDS
  const CARDS = {
    // the GPU, still "broadcast" in code (kura, Nov 5: the texts)
    broadcast: ["GPU", "Enchantment", "Stable temps once resolved.", "Broken until it resolves, then its temps are stable. A player with 3 stable GPUs wins."],
    spam: ["Spam", "Sorcery", "Their top 2 to their graveyard.", "Put the top 2 cards of their deck into their graveyard."],
    wiretap: ["Wiretap", "Sorcery", "1 of their top 3 to their graveyard.", "Look at the top 3 cards of their deck. Put 1 in their graveyard and the rest back in their deck."],
    undelete: ["Undelete", "Sorcery", "Your graveyard back into your deck.", "Shuffle your graveyard into your deck."],
    refute: ["Refute", "Instant", "Counter a spell.", "Counter target spell."],
    remand: ["Remand", "Instant", "Counter; it goes back to their hand.", "Counter target spell. Return it to its caster's hand."],
    rollback: ["Rollback", "Instant", "Counter; it goes on top of their deck.", "Counter target spell. Put it on top of its caster's deck."],
    paywall: ["Paywall", "Instant", "Counter unless they discard a card.", "Counter target spell unless the player who cast it discards a card."],
  };
  const WIN = 3;   // GPUs to win (rules.js WIN)
  // kura's words, Nov 5; the first line is the title, the rest are bullets (kura, Nov 5: "can we add bullet points", and a line about the
  // big card: "Hover to zoom on card!", reworded)
  const HOW_TO = [`Resolve ${WIN} GPUs to win!`, "Spam and Wiretap are attacks", "Counter a counter!", "Discard one to draw one", "Hold or hover to see a card up close"];
  const howTo = () => { const box = mk("div", "howto"), list = mk("ul"); list.append(...HOW_TO.slice(1).map((t) => mk("li", "", t))); box.append(mk("div", "", HOW_TO[0]), list); return box; };
  // an empty GPU place: a thermometer with a line through it, and "Temps: unstable" (kura, Nov 5)
  const NO_TEMP = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 13.5V5a2 2 0 0 1 4 0v8.5a4 4 0 1 1-4 0Z"/><path d="M12 9v7"/><path d="M3 3l18 18"/></svg>';
  const unstable = () => { const e = mk("div", "slot spot"); e.innerHTML = `${NO_TEMP}<span>Temps:<br>unstable</span>`; return e; };
  const $ = (id) => document.getElementById(id);
  const mk = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
  // the "?" (kura, Nov 5): the mouse resting on it shows how to play, and a click or tap keeps it shown until the next one
  let helpPinned = false;
  const helpShow = (on) => { $("helpbox").hidden = !on; if (on && !$("helpbox").firstChild) $("helpbox").append(howTo()); };
  $("help").onmouseenter = () => helpShow(true);
  $("help").onmouseleave = () => helpShow(helpPinned);
  $("help").onclick = () => { helpPinned = !helpPinned; helpShow(helpPinned); };
  // the match's own address (/m/<id>): from the address, or from the meta tag when the page came straight from / (index.js). The address
  // bar shows just "/" (kura, Nov 5: hide the long number); if the connection drops, the long address comes back, so reloading
  // reconnects to this match
  const PATH = location.pathname.startsWith("/m/") ? location.pathname : `/m/${document.querySelector('meta[name="match"]').content}`;
  const ws = new WebSocket(location.origin.replace(/^http/, "ws") + PATH + "/ws");
  ws.onopen = () => { if (location.pathname !== "/") history.replaceState(null, "", "/"); };
  const send = (o) => { $("err").textContent = ""; clearTimeout(autoTimer); autoTimer = null; ws.send(JSON.stringify(o)); };
  // when your only move is to pass the turn (no card you can play), it happens by itself a beat after the board has settled (kura, Nov 4:
  // "instead of PASS TURN can we have it automatically go to the next turn ... give it a beat"; Resolve stays a button: "i still like RESOLVE")
  const BEAT_MS = 1000;
  let autoAct = null, autoTimer = null;
  // after your move the match sends one board per action (each log line: yours, then the dummy's); they're shown STEP_MS apart, so
  // you can follow what happened (kura, Nov 4: "space out when they are displayed", and the log too)
  const STEP_MS = 1500, queue = [];   // (kura, Nov 4: slower; was 800)
  let playing = null;
  // a board the same as the one on screen is skipped (the last board of a move often repeats the one before it): redrawing it 1.5 s
  // later replaced the cards under your finger, so a click made then was lost (kura, Nov 4: after a Wiretap's first pick, "the next
  // click is a dropped click")
  let onScreen = "";
  const same = () => { while (queue.length && JSON.stringify(queue[0]) === onScreen) queue.shift(); };
  const show = (v) => {
    onScreen = JSON.stringify(v); draw(v); same();
    clearTimeout(autoTimer); autoTimer = !queue.length && autoAct ? setTimeout(() => { autoTimer = null; autoAct(); }, BEAT_MS) : null;   // the last board only
  };
  // a Wiretap's other cards going back follow your pick sooner: as soon as the picked card has landed (kura, Nov 5: "shorten that pause")
  const BACK_MS = 700;   // MOVE_MS, the picked card's flight
  const wait = () => !queue.length ? 0 : queue[0].pending?.kind === "wiretap" && queue[0].pending.step === "back" ? BACK_MS : STEP_MS;
  const play = () => { if (playing) return; const next = () => { same(); if (!queue.length) { playing = null; return; } show(queue.shift()); playing = setTimeout(next, wait()); }; next(); };
  ws.onmessage = (e) => { const m = JSON.parse(e.data); if (m.error) $("err").textContent = m.error; if (m.v) show(m.v); if (m.frames) { queue.push(...m.frames); play(); } };
  ws.onclose = () => { history.replaceState(null, "", PATH); $("err").textContent = "Disconnected. Reload the page to reconnect."; };

  // a card: name, picture, type line, effect and flavour (small: name, picture and the card's name)
  // a picture as one still frame on a canvas (like tap-game's still()); the loaded picture is kept per address, so a redraw is instant
  const pics = new Map();
  function still(src) {
    const cv = mk("canvas"); cv.width = 88; cv.height = 31;
    let im = pics.get(src);
    if (!im) { im = new Image(); im.src = src; pics.set(src, im); }
    const put = () => cv.getContext("2d").drawImage(im, 0, 0, 88, 31, 0, 0, 88, 31);   // the left 88x31: all of a still, the first frame of a frames strip (kura, Nov 5: the 5090 showed its whole strip squeezed in on a phone)
    if (im.complete && im.naturalWidth) put(); else im.addEventListener("load", put, { once: true });
    return cv;
  }
  // a GPU's fans turning once it has resolved (kura, Nov 5): its frames picture holds 24 frames side by side (88 wide each), drawn one
  // after another every SPIN_MS, a whole turn in about half a second (kura: "make them spin faster"); one timer for every spinning card,
  // and a canvas taken off the page is dropped from it. With reduced motion asked for, they turn slowly, a quarter as fast (kura, Nov 5:
  // "can we try the slow spin"; the first frame used to stay still).
  const SPIN_FRAMES = 24, SPIN_MS = 20, spinning = new Set();
  let spinTick = 0, spinTimer = null;
  function spin(src) {
    const cv = still(src);   // the first frame (still() draws the strip's left end, 88x31)
    spinning.add({ cv, im: pics.get(src) });
    spinTimer ??= setInterval(() => {
      spinTick = (spinTick + 1) % SPIN_FRAMES;
      for (const s of spinning) {
        if (!s.cv.isConnected) { spinning.delete(s); continue; }
        if (!s.im.complete || !s.im.naturalWidth) continue;
        const ctx = s.cv.getContext("2d"); ctx.clearRect(0, 0, 88, 31); ctx.drawImage(s.im, spinTick * 88, 0, 88, 31, 0, 0, 88, 31);
      }
      if (!spinning.size) { clearInterval(spinTimer); spinTimer = null; }
    }, matchMedia("(prefers-reduced-motion: reduce)").matches ? SPIN_MS * 4 : SPIN_MS);
    return cv;
  }

  // live: a GPU on its side's field, resolved. A GPU's picture is still until it resolves, then its fans spin (the ones with frames so far)
  // full: the big card, which shows the full text, and a GPU's generation after its type, like a Magic subtype (kura, Nov 5)
  function card(c, { small = false, click = null, gone = false, zoom = true, live = false, full = false } = {}) {
    const [name, kind, short, long] = CARDS[c.card], text = full ? long : short;
    const el = mk(click ? "button" : "div", `card ${c.card}${small ? " small" : ""}${click ? " can" : ""}${gone ? " gone" : ""}`);
    const gc = mk("div", "gc"), inn = mk("div", "gc-in"), art = mk("div", "gc-art");
    if (c.image && live && !gone && c.spin) art.append(spin(c.spin));
    else if (c.image && (gone || c.card === "broadcast")) art.append(still(c.image));
    else if (c.image) { const img = mk("img"); img.src = c.image; img.alt = ""; art.append(img); }
    const txt = mk("div", "gc-txt"), fx = mk("div");
    fx.append(mk("b", "", name), ` · ${text}`);
    txt.append(fx, mk("div", "rule"), mk("div", "flav", `“${c.flav}”`));
    const sub = full && !small && c.gen;
    // a resolved GPU's bar on a field: "GPU · ONLINE" and a green dot (kura, Nov 5)
    const online = small && live && c.card === "broadcast";
    const label = small ? (online ? `${name} · ONLINE` : name) : sub ? `${kind} — ${c.gen}` : kind;
    const type = mk("div", `gc-type${sub ? " sub" : ""}${sub && c.gen.length > 10 ? " long" : ""}${online ? " on" : ""}`, label);
    if (online) type.append(mk("span", "online"));
    inn.append(mk("div", "gc-name", c.name), art, type, txt);
    gc.append(inn); el.append(gc);
    if (click) {   // a tap plays it, and so does a quick upward flick on a phone; a flick's own click (if the browser sends one) is skipped
      let flicked = -1e9;
      el.onclick = (e) => { if (e.timeStamp - flicked > 500) click(e); };
      flickable(el, (e) => { flicked = e.timeStamp; click(e); });
    }
    el.dataset.uid = c.uid;
    if (c.uid?.[0] === "b") el.classList.add("theirs");   // seat b is always the Student Athlete
    if (zoom) zoomable(el, () => c);
    return el;
  }

  // the big card, copied from UN/TAP (tap-game src/page.html showBig() .. zoomable(); kura, Nov 4: "its perfect there"): press and hold a
  // card still for HOLD_MS (or rest the mouse on it without moving for HOVER_MS) to see it whole; letting go (or moving off) closes it. A
  // hold doesn't also cast: the click after it is swallowed. With its big card open, the mouse can go sideways until the card has turned a
  // half turn (TURN_OFF), and up or down HOVER_PAD px past the card. No big card from a mouse while the boards after a move are playing.
  const HOLD_MS = 450, HOVER_MS = 1000, HOVER_PAD = 16, TURN_OFF = 180;   // HOVER_MS 1000 (kura, Nov 5: "can we do 1000ms please"; was 1200)
  let bigCard = null, bigFlip = null, bigBy = null, held = false, bigTilt = false;   // bigBy: the card a mouse opened the big card from; bigTilt: it tilts too (a GPU in 3D)
  const ZEDGE = 8;   // layers that make the big card's edge (its thickness, .zedge)
  const fighting = () => !!playing;
  function showBig(c) {
    hideBig();
    const live = !!lastV && [...lastV.me.field, ...lastV.them.field].some((x) => x.uid === c.uid);   // a resolved GPU's fans spin on the big card too
    const gc = card(c, { zoom: false, live, full: true }).querySelector(".gc"), box = mk("div", "zbox");
    bigFlip = mk("div", "zflip"); bigFlip.append(gc, mk("div", "zback"));
    for (let k = 0; k < ZEDGE; k++) { const e = mk("div", "zedge"); e.style.setProperty("--k", (k + 0.5) / ZEDGE); bigFlip.append(e); }
    box.append(bigFlip); bigCard = mk("div", `zoom ${c.card}${c.uid?.[0] === "b" ? " theirs" : ""}`); bigCard.append(box); document.body.append(bigCard);   // its kind too, so a Broadcast's bar is dark there (kura, Nov 5)
    const shape = c.card === "broadcast" && c.image && GPU_3D[c.image.split("/").pop().replace(".png", "")];
    bigTilt = !!shape;
    if (shape) gpu3d(c, shape, gc, live);
  }
  function hideBig() { bigCard?.remove(); bigCard = null; bigFlip = null; bigBy = null; bigTilt = false; }

  // A GPU's big card shows it in 3D, with the real card's sides (kura, Nov 5: "give them a depth when you turn the card ... adding the
  // depth/sides to the flat GPU"). Each GPU's shape is its settings here, keyed by its picture's name:
  //   groups  parts that stand the same height off the card: d, how far in art pixels; boxes, each part's place on the picture
  //           { x, y, w, h } and which of its sides are drawn (sides: t top, b bottom, l left, r right; the hidden ones are left out);
  //           z: [z0, z1], a part that only stands from z0 to z1 up from the card (the bracket's legs), else all of 0 to d
  //   marks   on a box's side: top, bottom, left, right: [[a0, a1, b0, b1, paint, paint2?], ...]: from a0 to a1 along the side (x on
  //           the top and bottom, y on the left and right, in the picture's pixels) and b0 to b1 up from the card (0 on the card, d-1 at
  //           the front). paint: a colour (with paint2, a checkerboard), or "dp" / "hdmi": a port on the bracket, three wide (b0 to b0 + 2),
  //           shaded: its lining dark on the b0 side and lighter on the other, a dark lip at a0 and a lit one at a1, the plug's tongue
  //           down the middle; the HDMI's two corners on the lit side are the bracket's metal, its taper (kura, Nov 5, on the 5080);
  //           "hdmi-back": an HDMI turned over, its taper on the side nearest the card (the B580's, kura).
  //           Anything not marked is the picture's own edge colour, shaded as metal.
  // The front of each box is the picture itself (its fans spin there once it has resolved), and the flat picture under it is painted
  // black, so face on the big card looks as it did. Height: the real card's thickness at the picture's scale (its length in pixels).
  // The bracket (kura, Nov 5): its legs reach 2 px past the bottom of the fingers (about 9 mm: the bracket is
  // 120.02 mm from its top tab to its end), through the case's slot below the board, and its top tab sits 111.15 mm above it (a standard
  // full-height card's height, PCIe CEM), at the picture's scale from the card's real height, so it starts lower on cards taller than that
