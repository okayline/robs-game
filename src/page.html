<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rob's Game</title>
<!-- fonts served from this Worker (public/fonts, copied from tap-game: latin only, from npm's @fontsource; SIL Open Font License) -->
<link rel="preload" href="/fonts/cinzel-latin-600-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/fonts/eb-garamond-latin-500-normal.woff2" as="font" type="font/woff2" crossorigin>
<style>
  @font-face { font-family: Cinzel; font-weight: 600; font-display: swap; src: url(/fonts/cinzel-latin-600-normal.woff2) format("woff2"); }
  @font-face { font-family: Cinzel; font-weight: 800; font-display: swap; src: url(/fonts/cinzel-latin-800-normal.woff2) format("woff2"); }
  @font-face { font-family: "EB Garamond"; font-weight: 500; font-display: swap; src: url(/fonts/eb-garamond-latin-500-normal.woff2) format("woff2"); }
  @font-face { font-family: "EB Garamond"; font-weight: 700; font-display: swap; src: url(/fonts/eb-garamond-latin-700-normal.woff2) format("woff2"); }
  @font-face { font-family: "EB Garamond"; font-weight: 500; font-style: italic; font-display: swap; src: url(/fonts/eb-garamond-latin-500-italic.woff2) format("woff2"); }
  /* UN/TAP's "Grimoire Pastel" cards (tap-game src/page.html), with Rob's Game's text and no power/toughness box (kura, Nov 4) */
  :root {
    --bg: #1d2742; --panel: #f7fbff; --line: #b9d0ea; --frame: #8fb6de; --cream: #fffaf2;
    --ink: #3a4a6b; --mute: #5a6a8a; --pink: #e98ab3; --blue: #6d8fd0;
    --title: Cinzel, Georgia, serif; --body: "EB Garamond", Georgia, serif;
    /* five across: 78px = the page's 16px sides, the panel's 10px padding and 1px border each side, and four 6px gaps (was 72: 6px too
       wide on a phone, so the hand scrolled sideways) */
    --w: min(112px, calc((100vw - 78px) / 5)); --u: calc(var(--w) / 108); --h: 134;   /* 16 shorter than 150: the name bar's 12 and its 4 gap (kura, Nov 5: "make the cards shorter") */
    --sw: min(100px, calc((100vw - 72px) / 6));   /* small cards (fields, the stack, a Wiretap's look): name, picture and card name only */
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; color: var(--ink); height: 100%; overflow: hidden; }   /* one screen: fit(), below */
  html { background: var(--bg); }
  body { font: 15px/1.35 var(--body); }
  /* the space behind everything (kura, Nov 4: the same space picture as UN/TAP), on its own fixed layer because iPhones ignore
     background-attachment: fixed; the midnight blue shows until it loads */
  body::before { content: ""; position: fixed; inset: 0; z-index: -1; background: var(--bg) url(/space.jpg) center / cover; }
  #game { max-width: 640px; margin: 0 auto; padding: 12px 16px; display: flex; flex-direction: column; gap: 8px; user-select: none; -webkit-user-select: none; transform-origin: top center; }
  h1 { font: 800 22px/1 var(--title); letter-spacing: 2px; color: var(--frame);   /* blue (kura, Nov 5; was pink) */
       margin: 0; display: flex; justify-content: space-between; align-items: baseline; }
  h1 a { font: 600 12px/1 var(--title); letter-spacing: 1.5px; color: var(--blue); text-decoration: none; }
  .side { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; display: flex; flex-direction: column; gap: 6px; }
  .stat { font: 600 12px/1 var(--title); letter-spacing: 1.5px; text-transform: uppercase; color: var(--blue); display: flex; gap: 12px; flex-wrap: wrap; }
  .stat b { color: var(--ink); }
  .row { display: flex; gap: 6px; flex-wrap: wrap; min-height: calc(var(--sw) * 76 / 108); align-items: center; }
  /* your hand stays one row: it scrolls sideways when it's wider than the screen */
  /* the stack: the cards being cast, full size, in the middle of the screen */
  #stack { justify-content: center; align-items: flex-end; flex-wrap: nowrap; }
  /* every panel keeps one height whatever is in it, so nothing on the screen moves up or down (kura, Nov 4) */
  #stack { height: calc(var(--stack-w) * var(--h) / 108 + 12px); }   /* not clipped, so a card flying in shows all the way (kura, Nov 4) */
  #err { height: 1.2em; overflow: hidden; }
  /* a row of piles and Broadcasts: a small card and its label (kura, Nov 4: no empty space under the piles) */
  .zone { height: calc(var(--sw) * 76 / 108 + 20px); }
  /* wider than a phone, each row of piles and Broadcasts has 5 things (3 places, deck, graveyard), so they line up in your hand's
     5 columns, as wide as its cards (kura, Nov 4: "spread out evenly across and match the cards below them") */
  @media (min-width: 501px) {
    .side .zone { --sw: var(--w); display: grid; grid-template-columns: repeat(5, var(--w)); gap: 6px; align-items: start; }
    .zone .row, .zone .piles { display: contents; }
  }
  .zone .row { flex-wrap: nowrap; overflow: hidden; }
  #hand { height: calc(var(--h) * var(--u) + 4px); }
  /* the shared footer (dungeon-items footer.js), drawn into #ddfoot under the screen, a little in from the right (as in tap-game) */
  .ddfoot { margin: 1px 0 0 !important; padding: 0 12px !important; }
  #hand { flex-wrap: nowrap; overflow-x: auto; min-height: calc(var(--h) * var(--u)); padding-top: 2px; }
  .row:empty::after { content: attr(data-empty); font-style: italic; color: var(--mute); }
  #hand:not(:has(.card))::before { content: attr(data-empty); font-style: italic; color: var(--mute); }   /* your hand always holds the phone deck, so it is never :empty */
  .mid { background: #f0f6ff; border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; display: flex; flex-direction: column; gap: 6px; }
  /* your buttons: the upper right of your panel (kura, Nov 4) */
  /* your button (pass turn, resolve, don't pay) is a bar of its own above your panel, like UN/TAP's (kura, Nov 4: "the pass turn line be
     it's own panel like in un/tap"; tap-game's button.act); the bar keeps its height when there's no button, so nothing moves */
  .bar { display: flex; gap: 8px; height: 50px; flex: none; }
  .bar button { flex: 1; height: 50px; border-radius: 6px; border: 2px solid #fff; cursor: pointer; color: #3a2a4a; background: #b3cdf7;
                font: 800 17px/1 var(--title); letter-spacing: 3px; text-transform: uppercase; }
  /* blue whenever you can press it, grey when it only says what's happening (kura, Nov 5: "always be colored blue, except when its the
     inactive grey"; was pink, with a blue Resolve) */
  .bar button:disabled { cursor: default; background: #d3d9e3; color: #5f6b80; }
  .bar button:focus-visible, .card:focus-visible { outline: 2px solid var(--pink); outline-offset: 2px; }
  #err { color: #d4558c; font-size: 13px; min-height: 1em; }
  /* the log: a strip across the bottom of the middle panel, under the stack, so its lines are long and mostly one line each (kura,
     Nov 5: "a little bigger font size, and have a longer row that sits closer to the bottom of the panel ... less double lines"; it was
     a narrow column left of the stack, in 9px); 3 lines high, each older line fainter */
  #log { height: calc(3 * 1.3em + 6px); white-space: pre-wrap; font: italic 500 13px/1.3 var(--body); overflow: hidden; color: var(--ink);
         display: flex; flex-direction: column; justify-content: flex-end; gap: 3px; }
  /* no box of its own, and newest at the bottom: a new line slides the lines up (kura, Nov 5: "take the panel background away" and
     "newest messages appear on the bottom ... one line at a time scrolling up") */
  /* its last line says what to do now (kura, Nov 4: it was a line of its own above the stack) */
  #log .now { font-weight: 700; }
  #log .now.win { color: #2f9e6b; } #log .now.lose { color: #d4558c; }
  #log div::before { content: "C:\\> "; }
  /* the card: blue frame, cream inside (tap-game's .gc) */
  .card { position: relative; width: var(--w); height: calc(var(--h) * var(--u)); border: 0; padding: 0; background: none; border-radius: calc(7 * var(--u)); text-align: left; color: var(--ink); flex: none; }
  .card.small { --w: var(--sw); --u: calc(var(--w) / 108); height: calc(76 * var(--u)); }
  .card.can { cursor: pointer; }   /* no glow (kura, Nov 4: "no glow please"); the cards you can't play are dimmed */
  .card.dim { opacity: .55; }
  .card.gap { visibility: hidden; }
  #hand .handdeck { display: none; }   /* your deck in the hand's last place: phones only (below) */
  /* on a phone your deck stays in the 6th place however few cards you hold: empty places fill the hand up to 5 before it (kura, Nov 5:
     "sometimes my deck card moves to the left side of the row") */
  #hand .handpad { display: none; }
  .back .deckn, .pile .gravn { display: none; }   /* a deck's count on its back: phones only, the Webmaster's (below) */
  /* a card face down: the card-back stripes over it (a Wiretap's cards going back on a deck, and the dummy's look at yours) */
  .card.down { background: repeating-linear-gradient(45deg, var(--frame) 0 6px, color-mix(in srgb, var(--frame) 85%, #000) 6px 12px); }
  .card.down .gc { visibility: hidden; }
  /* the stack's cards stay in the middle, and a Wiretap's look cards come in to their right, sized to fit there (kura, Nov 4: "can the
     main card stay where it is and the buttons come in to the right of it"); 24px: a 6px gap before them and between them */
  /* the card being played is big (kura, Nov 4: "a lot bigger, not smaller"): --stack-w, about 1.45 times a hand card on a wide screen,
     as wide as a hand card on a phone */
  #stack { container-type: inline-size; }
  .mid { --stack-w: calc(var(--w) * 1.45 + 17px); }   /* + the room the "you" label took (kura, Nov 4: "bigger") */
  #stack .mid-stack .card { --w: var(--stack-w); --u: calc(var(--w) / 108); }
  #stack > .mid-stack { flex: none; display: flex; align-items: flex-end; }
  #stack > .stack-side { flex: 1 1 0; min-width: 0; align-self: stretch; display: flex; gap: 6px; align-items: center; }
  /* a Wiretap's look cards: stacked down the right side (kura, Nov 4: "3 buttons stacked vertically on the right"), as big as fit the
     row's height (3 small cards and two 6px gaps in the stack's height less 12px) and the right side's width */
  #stack > .stack-side.right { padding-left: 6px; flex-direction: column; justify-content: center; align-items: flex-start; }
  #stack .stack-side .look { --sw: min(calc(50cqw - var(--stack-w) / 2 - 12px), calc((var(--stack-w) * var(--h) / 108) * 108 / 228)); }
  /* a graveyard card: grey, and its picture is a still frame (kura, Nov 4) */
  .card.gone > .gc { filter: grayscale(1); opacity: .75; }   /* the face only, so a tappable graveyard's outline stays pink (kura, Nov 5) */
  .gc-art canvas { width: calc(88 * var(--u)); height: calc(31 * var(--u)); image-rendering: pixelated; }
  /* the Webmaster's: its cards, card backs and panel are a darker blue, so you can tell whose card is whose on the stack (kura, Nov 5; lavender
     before, but red-green colour blindness sees lavender and this blue as nearly the same; then mint, which "pops too much", then peach); its
     labels darker still. Darker and lighter blue stay apart for colour blindness too: it keeps lightness */
  .theirs, .them { --frame: #5679b6; }   /* a little lighter than #4a6fae (kura, Nov 5) */
  .them { --blue: #34548c; }
  /* its card backs are checks instead of your stripes (kura, Nov 5: picked "A checks" of four patterns): its deck, its face-down cards and
     its big card's back; the squares are the stripes' two shades */
  .them .back, .card.down.theirs, .zoom.theirs .zback { background: repeating-conic-gradient(var(--frame) 0 25%, color-mix(in srgb, var(--frame) 85%, #000) 0 50%) 0 0 / 10px 10px; }
  .gc { width: 100%; height: 100%; background: var(--frame); border-radius: calc(7 * var(--u)); padding: calc(5 * var(--u)); display: flex; flex-direction: column; }
  .gc-in { flex: 1; background: var(--cream); border-radius: calc(3 * var(--u)); padding: calc(4 * var(--u)); display: flex; flex-direction: column; gap: calc(4 * var(--u)); border: 1px solid var(--line); min-height: 0; }
  .gc-name { font: 600 calc(7.6 * var(--u))/1 var(--title); background: #ffe1ee; border: 1px solid #f0b8d0; border-radius: 2px; padding: 0 calc(4 * var(--u));
             height: calc(12 * var(--u)); display: flex; align-items: center; white-space: nowrap; overflow: hidden; }
  /* no name bar on the cards, only on the big card (kura, Nov 5: "remove the pink header from the cards ... remove the whole bar") */
  .card .gc-name { display: none; }
  .gc-art { height: calc(31 * var(--u)); display: flex; align-items: center; justify-content: center; }
  .gc-art img { width: calc(88 * var(--u)); height: calc(31 * var(--u)); image-rendering: pixelated; }
  .gc-type { font: 500 calc(6.4 * var(--u))/1 var(--body); background: #e2f0ff; border: 1px solid var(--line); border-radius: 2px; padding: 0 calc(4 * var(--u));
             height: calc(15 * var(--u)); display: flex; align-items: center; white-space: nowrap; overflow: hidden; }
  /* a Broadcast (a game point): its type line is inverted (kura, Nov 4) */
  .broadcast .gc-type { background: var(--ink); color: #e2f0ff; border-color: var(--ink); }
  .gc-txt { flex: 1; min-height: 0; overflow: hidden; background: #fffdf8; border: 1px solid var(--line); border-radius: 2px; padding: calc(4 * var(--u));
            font: 500 calc(8.5 * var(--u))/1.12 var(--body); display: flex; flex-direction: column; gap: calc(2 * var(--u)); }
  .gc-txt b { font-weight: 700; }
  .rule { margin-block: calc(1.5 * var(--u)) calc(.75 * var(--u)); width: 60%; height: 1px; background: #d9c9a8; align-self: center; flex: none; }
  .flav { font: italic 500 calc(5.8 * var(--u))/1.1 var(--body); color: var(--mute); }
  /* like UN/TAP: no flavour line (or the line above it) on the cards, so the card text is bigger (8.5, was 7.5: 9 cut Wiretap off); the big
     card still shows it, at the old 7.5 (kura, Nov 5: "like UN/TAP where we took the flavor text off and made the card text bigger") */
  .rule, .flav { display: none; }
  .zoom .rule, .zoom .flav { display: block; }
  .zoom .gc-txt { font-size: calc(7.5 * var(--u)); }
  /* small cards (fields, the stack, the dummy's looks) show only the name, picture and card name */
  .card.small .gc-txt { display: none; }
  .card.small .gc-type { font-size: calc(8 * var(--u)); }
  /* the piles: a deck face down (tap-game's card-back stripes, thicker the more cards are left) and a graveyard's top card face up */
  .zone { display: flex; gap: 10px; align-items: flex-start; }
  .zone .row { flex: 1; min-width: 0; }
  .piles { display: flex; gap: 8px; flex: none; }
  .pile { display: flex; flex-direction: column; align-items: center; gap: 7px; font: 600 10px/1 var(--title); letter-spacing: 1px; text-transform: uppercase; color: var(--blue); }
  .pile b { color: var(--ink); }
  .pile.tapme { cursor: pointer; }
  /* a graveyard you can tap: a grey dotted outline, then solid pink once tapped (kura, Nov 5) */
  .pile.tapme > :first-child { outline: 2px dotted #9aa3b8; outline-offset: 2px; }
  .pile.tapme.on > :first-child { outline: 2px solid var(--pink); }
  .pile.tapme.on span { color: var(--pink); }
  .back { width: var(--sw); height: calc(var(--sw) * 76 / 108); border-radius: calc(7 * var(--sw) / 108); flex: none;
          background: repeating-linear-gradient(45deg, var(--frame) 0 6px, color-mix(in srgb, var(--frame) 85%, #000) 6px 12px); }
  .slot.spot { border-style: dotted; }   /* a Broadcast's empty place: dotted (kura, Nov 4) */
  /* ... with a crossed-out signal and "Broadcast: OFF" in it (kura, Nov 4: "some sort of no signal sign"); sized to the place, small (kura, Nov 4: "can the text be smaller"), 6px at least */
  .slot.spot { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: calc(var(--sw) * .04); color: #9aa3b8;
               font: 600 max(6px, calc(var(--sw) * .075))/1.15 var(--title); letter-spacing: .5px; text-transform: uppercase; text-align: center; }
  .slot.spot svg { width: calc(var(--sw) * .28); height: calc(var(--sw) * .28); }
  .slot { width: var(--sw); height: calc(var(--sw) * 76 / 108); border-radius: calc(7 * var(--sw) / 108); border: 1.5px dashed var(--line); flex: none; }
  /* the stack, like Magic's: each card cast in answer sits on top of the one before, overlapping it and a little higher (kura, Nov 4) */
  #stack .mid-stack .card + .card { margin-left: calc(-0.55 * var(--stack-w)); }
  /* a card arriving: yours slides up from your hand, the dummy's down from its side; a Broadcast that lands pops in */
  /* on a phone your hand is two rows, 3 and then 2, so each card is about 1.7 times as wide (kura, Nov 4: "make the cards bigger on mobile",
     using the empty height); 66px = the page's 16px sides, the panel's 10px padding and 1px border each side, and two 6px gaps */
  /* on a phone the panels sit 5px in from the screen's edges with 8px inside them (kura, Nov 5: "decrease to like 5px on each side";
     was 14px); 52px = two 5px gaps, the panel's 1px border and 8px padding each side, and four 6px gaps between cards */
  @media (max-width: 500px) {
    :root { --w: calc((100vw - 52px) / 5); --sw: calc((100vw - 46px) / 6); }
    #game { padding: 8px 0; }
    .side, .mid, .bar { margin: 0 5px; }
    .side, .mid { padding-left: 8px; padding-right: 8px; }   /* room for a tappable graveyard's dashed outline (kura, Nov 5: "a little more padding"; was 4px) */
    #log { font-size: 12px; }   /* a phone: a little smaller, so most lines still fit on one */
    h1 { margin: 0 5px; }
    /* 40px: two 5px gaps, the panel's 1px border and 8px padding each side, and two 6px gaps between cards */
    .mid { --stack-w: calc((100vw - 40px) / 3 + 17px); }
    #hand { --w: calc((100vw - 40px) / 3); --u: calc(var(--w) / 108); flex-wrap: wrap; height: auto; overflow: visible; }
    /* each side's row fills the panel (kura, Nov 5: "make the broadcast off squares fit the size of the panel"); its height follows them */
    .zone { height: auto; }
    #tField, #mField { min-height: 0; align-items: flex-start; }
    /* with no labels under the piles, the deck and graveyard are the Broadcast places' size, and every place in the row is one size
       (kura, Nov 5: "make the cards match the other broadcast off squares"): 5 in the Webmaster's row (3 places, deck, graveyard), 4 in
       yours (your deck is in your hand); 6px between them */
    .side .zone { container-type: inline-size; gap: 6px; --sw: calc((100cqw - 18px) / 4); }
    .side.them .zone { --sw: calc((100cqw - 24px) / 5); }
    .piles { gap: 6px; }
    /* your deck moves from the piles into the hand's last place, face down at card size (kura, Nov 4: "last space can be the player's
       deck, face down cards") */
    #mPiles .pile:first-child { display: none; }
    /* its count in the middle of the card back, no label under it (kura, Nov 4: "just put a 20 in the middle of the back of the card") */
    #hand .handpad { display: block; }
    /* the Webmaster's deck shows its count on its back, like your deck in your hand, in dark ink, with no label under it (kura, Nov 5:
       "the number on top of the deck itself like the player does") */
    .them .back { display: flex; align-items: center; justify-content: center; }
    .them .back .deckn { display: block; font: 800 calc(var(--sw) * 22 / 108)/1 var(--title); color: #fff; text-shadow: 0 1px 3px rgba(0,0,0,.6); }   /* white, like your deck's (kura, Nov 5: was dark ink, which the darker blue hid) */
    .them .pile:first-child > span { display: none; }
    /* the graveyard's count on its card, with a gravestone, instead of the "graveyard" label (kura, Nov 5): white on a small black box in
       the middle, with the card showing around it (kura, Nov 5: "no glow ... a black background for just the emoji and the number") */
    .pile:has(.gravn) > span { display: none; }
    .pile { position: relative; }
    .pile .gravn { display: block; position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); pointer-events: none; white-space: nowrap;
                   font: 800 10px/1 var(--title); color: #fff; background: #000; border-radius: 3px; padding: 2px 4px; }   /* 10px (kura, Nov 5) */
    #hand .handdeck { display: flex; align-items: center; justify-content: center; width: var(--w); height: calc(var(--h) * var(--u)); border-radius: calc(7 * var(--u));
                      font: 800 calc(22 * var(--u))/1 var(--title); color: #fff; text-shadow: 0 1px 3px rgba(0,0,0,.6); }
  }
  /* the big card, copied from UN/TAP (tap-game src/page.html, kura, Nov 4: "copy the big card hover thing from un/tap exactly"): hold a
     card (hover with a mouse) to see it whole; --u is set again here so the whole card scales */
  .zoom { position: fixed; inset: 0; z-index: 20; display: flex; align-items: center; justify-content: center; background: rgba(20, 26, 48, .45); pointer-events: none; }
  .zoom .zbox { --w: min(78vw, 300px); --u: calc(var(--w) / 108); --h: 150;   /* the big card keeps its name bar, so its height */
                 width: var(--w); height: calc(var(--h) * var(--u)); position: relative; filter: drop-shadow(0 8px 24px rgba(0,0,0,.45)); perspective: calc(600 * var(--u)); }
  /* it turns with your finger or mouse, and past a quarter turn shows its back (UN/TAP's: 88x31 club's face-down stripes in the frame blue) */
  .zflip { position: absolute; inset: 0; transform-style: preserve-3d; }
  /* a finger sliding sideways on a card turns the big card, so the browser mustn't take the slide as a pan (that would cancel the hold) */
  .card { touch-action: pinch-zoom; }
  .zflip > .gc, .zflip > .zback { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; }
  /* thickness: the front sits --zd/2 in front, the back --zd/2 behind, and ZEDGE layers of a darker frame blue fill the gap */
  .zflip { --zd: calc(1 * var(--u)); }
  .zflip > .gc { transform: translateZ(calc(var(--zd) / 2)); }
  .zedge { position: absolute; inset: 0; border-radius: calc(7 * var(--u)); background: color-mix(in srgb, var(--frame) 75%, #000);
           transform: translateZ(calc((var(--k) - .5) * var(--zd))); }
  .zback { transform: rotateY(180deg) translateZ(calc(var(--zd) / 2)); border-radius: calc(7 * var(--u)); background: repeating-linear-gradient(45deg, var(--frame) 0 8px, color-mix(in srgb, var(--frame) 85%, #000) 8px 16px); }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
<div id="game">
  <h1>ROB'S GAME <a href="/">new match</a></h1>
  <div class="side them">
    <div class="stat">The Webmaster <span>hand <b id="tHand">0</b></span></div>
    <div class="zone"><div class="row" id="tField"></div><div class="piles" id="tPiles"></div></div>
  </div>
  <div class="mid">
    <div class="row" id="stack" data-empty=""></div>
    <div id="err"></div>
    <div id="log"></div>
  </div>
  <div class="bar" id="acts"></div>
  <div class="side">
    <div class="zone"><div class="piles" id="mPiles"></div><div class="row" id="mField"></div></div>
    <div class="row" id="hand" data-empty="No cards in hand."></div>
  </div>
  <div id="ddfoot"></div>
</div>
<script defer src="https://dungeon-items.ddddungeon.workers.dev/footer.js" data-version="v0.58" data-copy="no"></script>
<script>
  // the same card text as rules.js CARDS
  const CARDS = {
    broadcast: ["Broadcast", "Enchantment", "stays on your side when it resolves."],
    spam: ["Spam", "Sorcery", "put the top 2 cards of their deck into their graveyard."],
    wiretap: ["Wiretap", "Sorcery", "look at the top 3 cards of their deck. Put 1 in their graveyard and the rest back in any order."],
    undelete: ["Undelete", "Sorcery", "shuffle your graveyard into your deck."],
    refute: ["Refute", "Instant", "counter target spell."],
    remand: ["Remand", "Instant", "counter target spell. Return it to its caster's hand."],
    rollback: ["Rollback", "Instant", "counter target spell. Put it on top of its caster's deck."],
    paywall: ["Paywall", "Instant", "counter target spell unless its caster discards a card."],
  };
  const WIN = 3;   // Broadcasts to win (rules.js WIN)
  // an empty Broadcast place: a signal with a line through it, and "Broadcast: OFF"
  const NO_SIGNAL = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="1.5"/><path d="M8.5 8.5a5 5 0 0 0 0 7M15.5 8.5a5 5 0 0 1 0 7M5.5 5.5a9 9 0 0 0 0 13M18.5 5.5a9 9 0 0 1 0 13M12 14v7"/><path d="M3 3l18 18"/></svg>';
  const offAir = () => { const e = mk("div", "slot spot"); e.innerHTML = `${NO_SIGNAL}<span>Broadcast:<br>off</span>`; return e; };
  const $ = (id) => document.getElementById(id);
  const mk = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
  const ws = new WebSocket(location.href.replace(/^http/, "ws") + "/ws");
  const send = (o) => { $("err").textContent = ""; clearTimeout(autoTimer); autoTimer = null; ws.send(JSON.stringify(o)); };
  // when your only move is to pass the turn (no card you can play), it happens by itself a beat after the board has settled (kura, Nov 4:
  // "instead of PASS TURN can we have it automatically go to the next turn ... give it a beat"; Resolve stays a button: "i still like RESOLVE")
  const BEAT_MS = 1000;
  let autoAct = null, autoTimer = null;
  // after your move the match sends one board per action (each log line: yours, then the dummy's); they're shown STEP_MS apart, so
  // you can follow what happened (kura, Nov 4: "space out when they are displayed", and the log too)
  const STEP_MS = 1500, queue = [];   // (kura, Nov 4: slower; was 800)
  let playing = null;
  // a board the same as the one on screen is skipped (the last board of a move often repeats the one before it): redrawing it 1.5 s
  // later replaced the cards under your finger, so a click made then was lost (kura, Nov 4: after a Wiretap's first pick, "the next
  // click is a dropped click")
  let onScreen = "";
  const same = () => { while (queue.length && JSON.stringify(queue[0]) === onScreen) queue.shift(); };
  const show = (v) => {
    onScreen = JSON.stringify(v); draw(v); same();
    clearTimeout(autoTimer); autoTimer = !queue.length && autoAct ? setTimeout(() => { autoTimer = null; autoAct(); }, BEAT_MS) : null;   // the last board only
  };
  const play = () => { if (playing) return; const next = () => { same(); if (!queue.length) { playing = null; return; } show(queue.shift()); playing = setTimeout(next, queue.length ? STEP_MS : 0); }; next(); };
  ws.onmessage = (e) => { const m = JSON.parse(e.data); if (m.error) $("err").textContent = m.error; if (m.v) show(m.v); if (m.frames) { queue.push(...m.frames); play(); } };
  ws.onclose = () => { $("err").textContent = "Disconnected. Reload the page to reconnect."; };

  // a card: name, picture, type line, effect and flavour (small: name, picture and the card's name)
  // a picture as one still frame on a canvas (like tap-game's still()); the loaded picture is kept per address, so a redraw is instant
  const pics = new Map();
  function still(src) {
    const cv = mk("canvas"); cv.width = 88; cv.height = 31;
    let im = pics.get(src);
    if (!im) { im = new Image(); im.src = src; pics.set(src, im); }
    const put = () => cv.getContext("2d").drawImage(im, 0, 0, 88, 31);
    if (im.complete && im.naturalWidth) put(); else im.addEventListener("load", put, { once: true });
    return cv;
  }

  // live: a Broadcast on its side's field. A Broadcast's picture is still until it resolves and is "turned on", then it moves (kura, Nov 4)
  function card(c, { small = false, click = null, gone = false, zoom = true, live = false } = {}) {
    const [name, kind, text] = CARDS[c.card];
    const el = mk(click ? "button" : "div", `card ${c.card}${small ? " small" : ""}${click ? " can" : ""}${gone ? " gone" : ""}`);
    const gc = mk("div", "gc"), inn = mk("div", "gc-in"), art = mk("div", "gc-art");
    if (c.image && (gone || (c.card === "broadcast" && !live))) art.append(still(c.image));
    else if (c.image) { const img = mk("img"); img.src = c.image; img.alt = ""; art.append(img); }
    const txt = mk("div", "gc-txt"), fx = mk("div");
    fx.append(mk("b", "", name), ` · ${text}`);
    txt.append(fx, mk("div", "rule"), mk("div", "flav", `“${c.flav}”`));
    inn.append(mk("div", "gc-name", c.name), art, mk("div", "gc-type", small ? name : kind), txt);
    gc.append(inn); el.append(gc);
    if (click) {   // a tap plays it, and so does a quick upward flick on a phone; a flick's own click (if the browser sends one) is skipped
      let flicked = -1e9;
      el.onclick = (e) => { if (e.timeStamp - flicked > 500) click(e); };
      flickable(el, (e) => { flicked = e.timeStamp; click(e); });
    }
    el.dataset.uid = c.uid;
    if (c.uid?.[0] === "b") el.classList.add("theirs");   // seat b is always the Webmaster
    if (zoom) zoomable(el, () => c);
    return el;
  }

  // the big card, copied from UN/TAP (tap-game src/page.html showBig() .. zoomable(); kura, Nov 4: "its perfect there"): press and hold a
  // card still for HOLD_MS (or rest the mouse on it without moving for HOVER_MS) to see it whole; letting go (or moving off) closes it. A
  // hold doesn't also cast: the click after it is swallowed. With its big card open, the mouse can go sideways until the card has turned a
  // half turn (TURN_OFF), and up or down HOVER_PAD px past the card. No big card from a mouse while the boards after a move are playing.
  const HOLD_MS = 450, HOVER_MS = 1200, HOVER_PAD = 16, TURN_OFF = 180;
  let bigCard = null, bigFlip = null, bigBy = null, held = false;   // bigBy: the card a mouse opened the big card from
  const ZEDGE = 8;   // layers that make the big card's edge (its thickness, .zedge)
  const fighting = () => !!playing;
  function showBig(c) {
    hideBig();
    const live = !!lastV && [...lastV.me.field, ...lastV.them.field].some((x) => x.uid === c.uid);   // a resolved Broadcast moves on the big card too
    const gc = card(c, { zoom: false, live }).querySelector(".gc"), box = mk("div", "zbox");
    bigFlip = mk("div", "zflip"); bigFlip.append(gc, mk("div", "zback"));
    for (let k = 0; k < ZEDGE; k++) { const e = mk("div", "zedge"); e.style.setProperty("--k", (k + 0.5) / ZEDGE); bigFlip.append(e); }
    box.append(bigFlip); bigCard = mk("div", c.uid?.[0] === "b" ? "zoom theirs" : "zoom"); bigCard.append(box); document.body.append(bigCard);
  }
  function hideBig() { bigCard?.remove(); bigCard = null; bigFlip = null; bigBy = null; }
  // turning the open big card: a finger turns it by how far it has moved sideways since the press; a mouse by how far it has moved
  // across the small card since the big card opened (the card's width is a half turn)
  const FINGER_DEG_PX = 0.75;   // degrees per pixel a finger moves: 240px turns it to its back
  const turnBig = (deg) => { if (bigFlip) bigFlip.style.transform = `rotateY(${deg}deg)`; };
  addEventListener("click", (e) => { if (held) { held = false; e.stopPropagation(); e.preventDefault(); } }, true);
  document.addEventListener("contextmenu", (e) => { if (e.target.closest(".card")) e.preventDefault(); });   // a long press opens no menu
  // one press at a time: a hold starts on a card (zoomable, below); moving the finger or letting go anywhere ends it
  let holdTimer = null, hx = 0, hy = 0;
  const endHold = () => { clearTimeout(holdTimer); holdTimer = null; if (bigCard && held) { hideBig(); setTimeout(() => (held = false), 400); } };
  addEventListener("pointermove", (e) => {
    if (holdTimer && Math.hypot(e.clientX - hx, e.clientY - hy) > 8) { clearTimeout(holdTimer); holdTimer = null; }
    if (held && bigCard && e.pointerType !== "mouse") turnBig((e.clientX - hx) * FINGER_DEG_PX);
  });
  addEventListener("pointerup", endHold); addEventListener("pointercancel", endHold);
  // a quick upward flick on a card (a finger or pen, not a mouse) plays it, the same as tapping it (kura, Nov 5: "flick the card up to
  // play it", "the flick sends it to the stack"): at least FLICK_PX up, more up than sideways, within FLICK_MS; never while its big card is open
  const FLICK_PX = 40, FLICK_MS = 350;
  function flickable(el, play) {
    let x0 = 0, y0 = 0, t0 = 0;
    el.addEventListener("pointerdown", (e) => { if (e.pointerType !== "mouse") { x0 = e.clientX; y0 = e.clientY; t0 = e.timeStamp; } });
    el.addEventListener("pointerup", (e) => {
      if (e.pointerType === "mouse" || held || bigCard) return;
      const up = y0 - e.clientY;
      if (up >= FLICK_PX && up > Math.abs(e.clientX - x0) && e.timeStamp - t0 <= FLICK_MS) play(e);
    });
  }
  // el shows getC()'s card when held (touch or pen) or hovered (mouse)
  function zoomable(el, getC) {
    el.addEventListener("pointerdown", (e) => {
      if (e.pointerType === "mouse") return;
      hx = e.clientX; hy = e.clientY; held = false; clearTimeout(holdTimer);
      holdTimer = setTimeout(() => { holdTimer = null; held = true; showBig(getC()); }, HOLD_MS);
    });
    // a mouse: every move over the card starts the wait again, so it opens only once the mouse stops; once open it stays (and turns)
    // until it has turned TURN_OFF or the mouse is more than HOVER_PAD above or below the card
    let hover = null, open = false, x0 = 0;
    const deg = (e) => (e.clientX - x0) / el.getBoundingClientRect().width * 180;
    const turn = (e) => { if (bigBy === el) turnBig(deg(e)); };
    const away = (e) => {
      const r = el.getBoundingClientRect(), y = e.clientY;
      if (el.isConnected && Math.abs(deg(e)) < TURN_OFF && y >= r.top - HOVER_PAD && y <= r.bottom + HOVER_PAD) { turn(e); return; }
      removeEventListener("pointermove", away); open = false; if (bigBy === el) hideBig();
    };
    const wait = (e) => {
      if (e.pointerType !== "mouse") return;
      if (open) { turn(e); return; }
      x0 = e.clientX; clearTimeout(hover);
      if (fighting()) return;   // no big card from a mouse while boards are playing; the next move once they're done starts the wait again
      hover = setTimeout(() => { if (el.isConnected && !fighting()) { open = true; showBig(getC()); bigBy = el; } }, HOVER_MS);
    };
    el.addEventListener("pointerenter", wait); el.addEventListener("pointermove", wait);
    el.addEventListener("pointerleave", (e) => { if (e.pointerType !== "mouse") return; clearTimeout(hover); if (open) addEventListener("pointermove", away); });
    // clicking the card closes its big card: a cast card leaves the page, so its pointerleave never comes (kura, Nov 4: "it gets stuck there")
    el.addEventListener("click", () => { clearTimeout(hover); if (bigBy === el) hideBig(); open = false; });
  }

  // a side's piles (kura, Nov 4): its deck face down, then its graveyard; at the right of the dummy's panel, the top left of yours
  // onStack: a card shown on the stack while the match already has it in a graveyard (a Wiretap being finished): it isn't shown in the
  // graveyard until it leaves the stack, so it flies there then (kura, Nov 4: "after the wiretap, the main card just disappeared")
  function piles(side, onStack = null) {
    const pile = (el, label, n) => { const p = mk("div", "pile"); const t = mk("span", "", `${label} `); t.append(mk("b", "", n)); p.append(el, t); return p; };
    const out = [];
    const back = mk("div", side.deck ? "back" : "slot");
    const k = Math.min(4, Math.ceil(side.deck / 8));   // a thicker stack for a fuller deck
    back.style.boxShadow = Array.from({ length: k }, (_, i) => `${i + 1}px ${i + 1}px 0 color-mix(in srgb, var(--frame) ${70 - i * 10}%, #000)`).join(",") || "none";
    if (side.deck) back.append(mk("b", "deckn", side.deck));   // the count on the back itself: the Webmaster's deck on a phone (CSS)
    out.push(pile(back, "deck", side.deck));
    const grave = side.grave.filter((c) => c.uid !== onStack), top = grave[grave.length - 1];
    const g = pile(top ? card(top, { small: true, gone: true }) : mk("div", "slot"), "graveyard", grave.length);
    g.append(mk("b", "gravn", `🪦 ${grave.length}`));   // the count on the card itself, on a phone (CSS)
    out.push(g);
    return out;
  }

  // the cards on the stack and the fields at the last draw: only a card that wasn't there animates in
  let shown = new Set();
  let logN = null;   // how many log lines were on screen, so a new one can slide in
  // your hand at the last draw: a card that wasn't in it is dealt, flying from your deck to its place (kura, Nov 4: "auto deal"),
  // one after another when there are several (the opening five)
  let inHand = new Set(), slots = [];   // slots: your hand's places, a card's uid or null for a gap
  // from your deck: the one in your hand's last place on a phone, else the one in your piles (whichever is showing)
  const myDeck = () => [$("hand").querySelector(".handdeck"), $("mPiles").querySelector(".back, .slot")].find((e) => e && e.offsetParent);
  const deal = (els) => fly(els, myDeck());
  // cards fly to their places from another spot on the screen (from: an element), like UN/TAP's cards sliding between rows: dealt
  // cards from your deck, cards cast onto the stack from your hand or the dummy's side (kura, Nov 4: the old slide-in was cut off)
  // from: an element, or a box already measured (a card you played, measured when you clicked it); gap: ms between cards
  function fly(els, from, { gap = 150, ms = 600, scale = .45, delay = 0 } = {}) {
    if (!els.length || !from || matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    const k = $("game").getBoundingClientRect().width / $("game").offsetWidth || 1;   // fit()'s scale
    const d = from.getBoundingClientRect ? from.getBoundingClientRect() : from;
    els.forEach((el, i) => {
      const r = el.getBoundingClientRect();
      const dx = (d.left + d.width / 2 - (r.left + r.width / 2)) / k, dy = (d.top + d.height / 2 - (r.top + r.height / 2)) / k;
      // above everything while it flies: a Broadcast on a field comes later in the page and would be drawn over it (kura, Nov 4: "it goes
      // under the broadcast card")
      el.style.zIndex = 5;
      const a = el.animate([{ transform: `translate(${dx}px, ${dy}px) scale(${scale})`, opacity: .4 }, { transform: "none", opacity: 1 }],
        { duration: ms, delay: delay + i * gap, easing: "ease-out", fill: "backwards" });
      a.onfinish = a.oncancel = () => { el.style.zIndex = ""; };
    });
  }
  // cards flying off to a spot on the screen and staying there, at its size, until the next board (the reverse of fly; nothing fades:
  // kura, Nov 4, "not have disappearing animations"): a Wiretap's unpicked cards back onto the dummy's deck, in the order they go
  // back, so the card on top lands last
  // flip: each card turns face down halfway there, the way a card put back on a deck goes face down (kura, Nov 4)
  function away(els, to, { flip = false } = {}) {
    if (!els.length || !to || matchMedia("(prefers-reduced-motion: reduce)").matches) { if (flip) els.forEach((el) => el.classList.add("down")); return; }
    const k = $("game").getBoundingClientRect().width / $("game").offsetWidth || 1, d = to.getBoundingClientRect();
    els.forEach((el, i) => {
      const r = el.getBoundingClientRect();
      const dx = (d.left + d.width / 2 - (r.left + r.width / 2)) / k, dy = (d.top + d.height / 2 - (r.top + r.height / 2)) / k, s = d.width / r.width;
      el.style.position = "relative"; el.style.zIndex = 5 + i;   // a later card flies over an earlier one
      const delay = 300 + i * 500, ms = 700;
      const mid = `translate(${dx / 2}px, ${dy / 2}px) scale(${(1 + s) / 2})`;
      el.animate(flip ? [{ transform: "none" }, { transform: `${mid} scaleX(0)`, offset: .5 }, { transform: `translate(${dx}px, ${dy}px) scale(${s})` }]
        : [{ transform: "none" }, { transform: `translate(${dx}px, ${dy}px) scale(${s})` }], { duration: ms, delay, easing: "ease-in-out", fill: "forwards" });
      if (flip) setTimeout(() => el.classList.add("down"), delay + ms / 2);
    });
  }
  // kura, Nov 4 (the rule): every card that leaves a spot flies to where it went, one after another (MOVE_GAP apart): face up to a
  // graveyard or a Broadcast place, turning face down halfway to a deck. A card still on screen flies from its old box to its new one;
  // one that's now out of sight (in a deck, or under a graveyard's top card) is copied, and the copy flies onto the pile.
  const MOVE_GAP = 400, MOVE_MS = 700;
  function ghost(src, box, to, { delay = 0, flip = false } = {}) {
    if (!to || !box.width || matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    const d = to.getBoundingClientRect(), g = src.cloneNode(true);
    g.classList.remove("dim", "can"); g.style.cssText = "";
    Object.assign(g.style, { position: "fixed", left: `${box.left}px`, top: `${box.top}px`, width: `${box.width}px`, height: `${box.height}px`, margin: "0",
      zIndex: "30", pointerEvents: "none", transformOrigin: "0 0", visibility: "hidden" });
    g.style.setProperty("--w", `${box.width}px`); g.style.setProperty("--sw", `${box.width}px`); g.style.setProperty("--u", "calc(var(--w) / 108)");
    document.body.append(g);
    const s = d.width / box.width, dx = d.left - box.left, dy = d.top - box.top, end = `translate(${dx}px, ${dy}px) scale(${s})`;
    const k = flip ? [{ transform: "none" }, { transform: `translate(${dx / 2}px, ${dy / 2}px) scale(${(1 + s) / 2}, ${(1 + s) / 2}) scaleX(0)`, offset: .5 }, { transform: end }]
      : [{ transform: "none" }, { transform: end }];
    setTimeout(() => (g.style.visibility = ""), delay);
    if (flip) setTimeout(() => g.classList.add("down"), delay + MOVE_MS / 2);
    g.animate(k, { duration: MOVE_MS, delay, easing: "ease-in-out", fill: "forwards" }).finished.then(() => g.remove());
  }
  let lastV = null, sentAway = new Set(), discarding = false;   // discarding: you pressed Discard and are picking the card   // the board before this one; the Wiretap cards already flown back onto a deck
  // the card you just played from your hand, and where it was: it flies onto the stack from there (kura, Nov 4)
  let played = null, looked = new Set(), lookOrder = [];   // looked: the Wiretap look cards on screen; lookOrder: their uids, left to right
  let downN = 0, downBoxes = [];   // the dummy's Wiretap: how many of your cards it's looking at (face down), and where they were on screen
  const play1 = (c, msg) => (e) => { played = { uid: c.uid, box: e.currentTarget.getBoundingClientRect() }; send(msg); };

  function draw(v) {
    const before = new Map([...document.querySelectorAll("#game .card[data-uid]")].map((el) =>
      [el.dataset.uid, { el, box: el.getBoundingClientRect(), where: el.closest("#stack") ? "stack" : el.closest("#hand") ? "hand" : "other" }]));
    const pv = lastV; lastV = v;
    const tDeckBox = $("tPiles").querySelector(".back, .slot")?.getBoundingClientRect(), mDeckBox = myDeck()?.getBoundingClientRect();
    $("tHand").textContent = v.them.hand;
    const onStack = v.pending?.kind === "wiretap" ? v.pending.card.uid : null;
    $("tPiles").replaceChildren(...piles(v.them, onStack)); $("mPiles").replaceChildren(...piles(v.me, onStack));
    // each side's Broadcasts fill three dotted places, one per Broadcast needed to win (kura, Nov 4: "blank areas for the 3 broadcast cards")
    const field = (list) => [...list.map((c) => card(c, { small: true, live: true })), ...Array.from({ length: Math.max(0, WIN - list.length) }, offAir)];
    $("tField").replaceChildren(...field(v.them.field));
    $("mField").replaceChildren(...field(v.me.field));
    const p = v.pending, mine = v.waiting, acts = [];
    let ask, playable = () => null;
    if (v.winner) ask = v.winner === "me" ? "You win!" : "The Webmaster wins.";
    else if (p?.kind === "answer" && p.mine) {
      const top = v.stack[v.stack.length - 1];
      ask = `The Webmaster cast ${CARDS[top.card][0]}. Answer it with a counter, or resolve it.`;
      playable = (c) => (CARDS[c.card][1] === "Instant" ? play1(c, { do: "cast", uid: c.uid }) : null);
      acts.push(["Resolve", () => send({ do: "let" })]);
    } else if (p?.kind === "wiretap" && p.mine) ask = p.step === "mill" ? "Wiretap: pick the card to put in their graveyard." : "Wiretap: pick the card to go under the other.";
    else if (p?.kind === "paywall" && p.mine) {
      ask = "Paywall: pick a card from your hand to discard, or let your spell be countered.";
      playable = (c) => () => send({ do: "pay", uid: c.uid });
      acts.push(["Don't pay", () => send({ do: "pay", uid: null })]);
    } else if (mine && v.turn === "me" && discarding && !v.cast) {   // discard mode (your graveyard tapped): any card in your hand
      ask = "Discard: pick a card to throw away. You draw one. Tap your graveyard to cancel.";
      playable = (c) => () => { discarding = false; send({ do: "discard", uid: c.uid }); };
      acts.push(["Discard", null]);   // the bar says what you're doing (kura, Nov 5); tap your graveyard to cancel
    } else if (mine && v.turn === "me") {
      ask = v.cast ? "Your turn. You've cast your spell; pass when you're done." : "Your turn: cast an Enchantment or a Sorcery, tap your graveyard to discard a card and draw one, or pass.";
      if (!v.cast) playable = (c) => (CARDS[c.card][1] !== "Instant" ? play1(c, { do: "cast", uid: c.uid }) : null);
      acts.push(["Pass turn", () => send({ do: "pass" })]);
    } else ask = "The Webmaster is thinking…";
    const now = mk("div", "now" + (v.winner ? (v.winner === "me" ? " win" : " lose") : ""), ask);
    // oldest at the top, each older line fainter, and what to do now at the bottom (kura, Nov 5); when a line is added, the lines start
    // one new line lower and slide up into place
    const lines = v.log.slice(-2).map((l, k, a) => { const d = mk("div", "", l); d.style.opacity = 1 - (a.length - k) * 0.125; return d; });
    const added = logN != null && v.log.length > logN; logN = v.log.length;
    $("log").replaceChildren(...lines, now);
    if (added && lines.length && !matchMedia("(prefers-reduced-motion: reduce)").matches) {
      const up = lines[lines.length - 1].offsetHeight + 3;   // the new line and the 3px gap above it
      for (const d of $("log").children) d.animate([{ transform: `translateY(${up}px)` }, { transform: "none" }], { duration: 350, easing: "ease-out" });
    }
    // the stack, full size so its text can be read (kura, Nov 4); a Wiretap being finished stays there, with the cards it looks at
    const cards = p?.kind === "wiretap" ? [p.card] : v.stack, from = [];
    const els = cards.map((c, i) => {
      const el = card(c);   // no "you" or "dummy" label under it (kura, Nov 4)
      el.style.marginBottom = `${i * 10}px`;   // each later card sits a little higher
      if (!shown.has(c.uid)) from.push([el, played?.uid === c.uid ? played.box : c.by === "me" ? $("hand") : $("tHand")]);
      return el;
    });
    // a Wiretap's look: the cards come off the top of the dummy's deck one by one, slowly (kura, Nov 4: they appeared too fast), and
    // sit a little higher than the bottom of the stack row
    const back = p?.step === "back";   // the cards not picked going back on top of the deck: not clickable, and they fly there
    // yours: the cards keep their places on screen while you pick (kura, Nov 4: they seemed to go back in the wrong order); going back,
    // they turn face down and fly onto the dummy's deck in the order they go back, so the new top card lands last
    const mineLook = p?.kind === "wiretap" && p.mine ? [...p.look] : [];
    mineLook.sort((x, y) => (lookOrder.indexOf(x.uid) + 1 || 99) - (lookOrder.indexOf(y.uid) + 1 || 99));
    const look = mineLook.map((c) => { const el = card(c, { small: true, click: back ? null : () => send({ do: "tap", uid: c.uid }) }); el.classList.add("look"); el.dataset.uid = c.uid; return el; });
    const newLook = look.filter((el, i) => !looked.has(mineLook[i].uid));
    looked = new Set(mineLook.map((c) => c.uid)); lookOrder = mineLook.map((c) => c.uid);
    // the dummy's: your top cards, face down, come off your deck; the one it picks goes to your graveyard; the rest go back on your deck
    // (kura, Nov 4: "simply and lightly animate what's actually happening")
    const n = p?.kind === "wiretap" && !p.mine ? p.n : 0;
    const down = Array.from({ length: n }, () => mk("div", "card small look down"));
    els.push(...look, ...down);
    const mid = mk("div", "mid-stack"), right = mk("div", "stack-side right");
    mid.append(...els.filter((el) => !el.classList.contains("look"))); right.append(...els.filter((el) => el.classList.contains("look")));
    $("stack").replaceChildren(mk("div", "stack-side"), mid, right);
    const prevDown = downN, prevBoxes = downBoxes;
    downN = back ? 0 : n; downBoxes = down.map((el) => el.getBoundingClientRect());
    const later = [];   // animations that need your hand drawn first (on a phone your deck is in it)
    for (const [el, src] of from) fly([el], src);
    fly(newLook, $("tPiles").querySelector(".back, .slot"), { gap: 400, ms: 900, scale: .6 });
    if (back && look.length) {
      const byUid = new Map(look.map((el) => [el.dataset.uid, el]));
      away([...p.look].reverse().map((c) => byUid.get(c.uid)), $("tPiles").querySelector(".back, .slot"), { flip: true });   // p.look[0]: the new top card
      for (const c of p.look) sentAway.add(c.uid);
    }
    if (n && !back && n > prevDown) later.push(() => fly(down.slice(prevDown), myDeck(), { gap: 400, ms: 900, scale: .6 }));
    if (n && !back && n < prevDown && prevBoxes.length) later.push(() => fly([$("mPiles").querySelectorAll(".pile")[1]?.firstChild].filter(Boolean), prevBoxes[prevBoxes.length - 1], { ms: 700, scale: 1 }));
    if (n && back) later.push(() => away([...down].reverse(), myDeck()));
    shown = new Set([...cards, ...v.them.field, ...v.me.field].map((c) => c.uid));
    // the pink button is always there (kura, Nov 4: "could we always see the pink button"): with nothing for you to press, it says why
    // and can't be pressed
    // discard by tapping your graveyard (kura, Nov 4: "tap graveyard to toggle"; no new button, no dragging): while you could discard
    // instead of casting it has a dashed pink outline; tapped, a solid one (discard mode), and a card you tap goes there; tap again to leave
    const canDiscard = !!mine && v.turn === "me" && !p && !v.cast && !v.winner && v.me.hand.length > 0;
    if (!canDiscard) discarding = false;
    const myGrave = $("mPiles").querySelectorAll(".pile")[1];
    if (myGrave && canDiscard) {
      myGrave.classList.add("tapme"); myGrave.classList.toggle("on", discarding);
      myGrave.onclick = () => { discarding = !discarding; draw(lastV); };
    }
    autoAct = null;
    if (acts.length === 1 && acts[0][0] === "Pass turn" && !canDiscard && !v.winner && !v.me.hand.some((c) => playable(c))) {   // nothing else to do: it passes by itself
      autoAct = acts[0][1];
      acts[0] = ["Passing…", null];
    }
    if (!acts.length) acts.push([v.winner ? (v.winner === "me" ? "You win" : "The Webmaster wins") : p?.kind === "wiretap" && p.mine ? "Pick a card" : v.turn === "them" ? "Webmaster's turn" : "Webmaster's answering", null]);
    $("acts").replaceChildren(...acts.map(([t, f]) => { const b = mk("button", "", t); if (f) b.onclick = f; else b.disabled = true; return b; }));
    // your hand keeps its places: a card that leaves leaves a gap, and a new card fills the first gap (kura, Nov 4: "the remaining
    // cards stay in the same place")
    const held = new Map(v.me.hand.map((c) => [c.uid, c]));
    slots = slots.map((u) => (held.has(u) ? u : null));
    for (const c of v.me.hand) if (!slots.includes(c.uid)) { const i = slots.indexOf(null); if (i < 0) slots.push(c.uid); else slots[i] = c.uid; }
    while (slots.length && slots[slots.length - 1] === null) slots.pop();
    const dealt = [];
    const deck = mk("div", `handdeck ${v.me.deck ? "back" : "slot"}`, v.me.deck);   // your deck again, for a phone's hand (CSS shows one of the two)
    $("hand").replaceChildren(...slots.map((u) => {
      if (u === null) return mk("div", "card gap");
      const c = held.get(u), f = v.winner ? null : playable(c), el = card(c, { click: f });
      if (!f && !v.winner) el.classList.add("dim");
      if (!inHand.has(c.uid) && !before.has(c.uid)) dealt.push(el);   // a card back from the stack (Remand) flies from there instead
      return el;
    }), ...Array.from({ length: Math.max(0, 5 - slots.length) }, () => mk("div", "card gap handpad")), deck);   // 5: rules.js HAND
    inHand = new Set(held.keys());
    deal(dealt);
    for (const f of later) f();
    // the rule: cards that left the stack, your hand or a graveyard's top fly to where they went
    const graveOf = (sel) => document.querySelector(sel)?.querySelectorAll(".pile")[1]?.firstElementChild;   // sel: "#mPiles" or "#tPiles"
    const deckOf = (uid) => (uid[0] === "a" ? myDeck() : pv && v.them.deck <= pv.them.deck ? $("tHand") : $("tPiles").querySelector(".back, .slot"));   // seat a is always you; the dummy's card goes to its hand (Remand) unless its deck grew
    const inGrave = (uid) => (v.me.grave.some((c) => c.uid === uid) ? "#mPiles" : v.them.grave.some((c) => c.uid === uid) ? "#tPiles" : null);
    let i = 0;
    for (const [uid, b] of before) {
      if (sentAway.has(uid)) continue;
      const now = document.querySelector(`#game .card[data-uid="${uid}"]`);
      if (now) {   // still on screen: moved from the stack or your hand to a Broadcast place or a graveyard's top
        if (b.where === "stack" && now.closest("#hand")) { fly([now], b.box, { ms: MOVE_MS, scale: b.box.width / now.getBoundingClientRect().width, delay: i++ * MOVE_GAP }); continue; }
        if (b.where !== "other" && !now.closest("#stack, #hand")) fly([now], b.box, { ms: MOVE_MS, scale: b.box.width / now.getBoundingClientRect().width, delay: i++ * MOVE_GAP });
        continue;
      }
      const g = inGrave(uid);
      if (b.where === "other" && g) continue;   // a graveyard's old top card, now under a newer one
      if (g) ghost(b.el, b.box, graveOf(g), { delay: i++ * MOVE_GAP });   // into a graveyard, under another card going there too
      else if (!v.me.hand.some((c) => c.uid === uid)) ghost(b.el, b.box, deckOf(uid), { delay: i++ * MOVE_GAP, flip: true });   // onto a deck: Rollback, Undelete
    }
    // a card milled straight off a deck (Spam) flies from the deck to the graveyard (a Wiretap's milled card has its own flight, above)
    if (pv && pv.pending?.kind !== "wiretap" && v.pending?.kind !== "wiretap")
      for (const [side, id, box] of [["me", "#mPiles", mDeckBox], ["them", "#tPiles", tDeckBox]]) {
        const top = graveOf(id);
        if (box && top?.dataset.uid && !before.has(top.dataset.uid) && v[side].deck < pv[side].deck)
          fly([top], box, { ms: MOVE_MS, scale: box.width / top.getBoundingClientRect().width, delay: i++ * MOVE_GAP });
      }
    // the dummy's draws: face-down cards from its deck to its hand count
    if (pv && tDeckBox && v.them.hand > pv.them.hand && v.them.deck < pv.them.deck)
      for (let k = 0; k < Math.min(v.them.hand - pv.them.hand, pv.them.deck - v.them.deck); k++) ghost(mk("div", "card small down"), tDeckBox, $("tHand"), { delay: k * 150 });
    fit();
  }
  // shrink the whole screen to fit a short window, never grow it (tap-game's fit())
  const fit = () => { const g = $("game"); g.style.transform = `scale(${Math.min(1, innerHeight / g.offsetHeight)})`; };
  addEventListener("resize", fit);
</script>
</body>
</html>
